<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerraControl App Smoke Test</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;background:#0d1722;color:#f8fafc}
h1{margin-bottom:8px}.muted{color:#94a3b8}.summary{font-weight:700;margin:20px 0}.ok{color:#86efac}.fail{color:#fca5a5}li{margin:7px 0}iframe{width:1px;height:1px;border:0;position:absolute;left:-9999px}
</style>
</head>
<body>
<h1>TerraControl App Smoke Test</h1>
<p class="muted">Prüft Einstiegspunkt, lokale Assets, globale APIs und Modulregistrierung.</p>
<div id="summary" class="summary">Test läuft …</div>
<ol id="results"></ol>
<iframe id="appFrame" src="../../v500.html?v=1.0.4-rc.11"></iframe>
<script>
(function(){
'use strict';

const results=[];
const expectedModules=[
 'dashboard','animals','offspring','profile','food','qr','backup','assistant','chat'
];

function record(name,passed,detail){
 results.push({name,passed,detail:detail||''});
}

function render(){
 const list=document.getElementById('results');
 list.innerHTML=results.map(function(result){
  return '<li class="'+(result.passed?'ok':'fail')+'">'+
   (result.passed?'PASS':'FAIL')+' — '+result.name+
   (result.detail?' <span class="muted">('+result.detail+')</span>':'')+
   '</li>';
 }).join('');

 const failed=results.filter(function(result){return !result.passed;}).length;
 const summary=document.getElementById('summary');
 summary.textContent=failed
  ?failed+' von '+results.length+' Prüfungen fehlgeschlagen.'
  :results.length+' Prüfungen erfolgreich.';
 summary.className='summary '+(failed?'fail':'ok');
 document.title=failed?'FAIL — TerraControl Smoke Test':'PASS — TerraControl Smoke Test';
}

async function testAssets(){
 const response=await fetch('../../v500.html?v=1.0.4-rc.11',{cache:'no-store'});
 record('v500.html erreichbar',response.ok,'HTTP '+response.status);
 if(!response.ok)return;

 const html=await response.text();
 const doc=new DOMParser().parseFromString(html,'text/html');
 const urls=Array.from(doc.querySelectorAll('script[src],link[rel="stylesheet"][href]'))
  .map(function(node){return node.getAttribute('src')||node.getAttribute('href');})
  .filter(function(url){return url&& !/^https?:\/\//.test(url);});

 record('lokale Start-Assets gefunden',urls.length>0,String(urls.length));

 for(const url of urls){
  const assetUrl=new URL(url,response.url).href;
  try{
   const assetResponse=await fetch(assetUrl,{cache:'no-store'});
   record('Asset erreichbar: '+url,assetResponse.ok,'HTTP '+assetResponse.status);
  }catch(error){
   record('Asset erreichbar: '+url,false,error.message);
  }
 }

 const serviceWorkerResponse=await fetch(
  '../../service-worker.js',
  {cache:'no-store'}
 );

 record(
  'Service Worker erreichbar',
  serviceWorkerResponse.ok,
  'HTTP '+serviceWorkerResponse.status
 );

 if(serviceWorkerResponse.ok){
  const serviceWorker=await serviceWorkerResponse.text();

  const missingAppShellAssets=urls.filter(function(url){
   const path=String(url).split('?')[0];
   return !serviceWorker.includes(path);
  });

  record(
   'lokale Start-Assets in App-Shell enthalten',
   missingAppShellAssets.length===0,
   missingAppShellAssets.join(', ')
  );
 }
}

function testRuntime(){
 return new Promise(function(resolve){
  const frame=document.getElementById('appFrame');
  let finished=false;

  const timeout=setTimeout(function(){
   if(finished)return;
   finished=true;
   record('App-Frame geladen',false,'Timeout');
   resolve();
  },15000);

  function inspectFrame(){
   if(finished)return;
   finished=true;
   clearTimeout(timeout);
   record('App-Frame geladen',true);

   try{
    const win=frame.contentWindow;
    record('NGT500 verfügbar',!!win.NGT500);
    record('NGTStore verfügbar',!!win.NGTStore);
    record('AnimalEngine verfügbar',!!win.AnimalEngine);
    record('FoodInventoryEngine verfügbar',!!win.FoodInventoryEngine);
    record('CareRulesEngine verfügbar',!!win.CareRulesEngine);
    record('NGTSyncPolicyEngine verfügbar',!!win.NGTSyncPolicyEngine);
    record(
     'Gemeinsame Dashboard-Datenebene verfügbar',
     !!(
      win.NGTDashboardData&&
      typeof win.NGTDashboardData.activeAnimals==='function'&&
      typeof win.NGTDashboardData.dueTaskCount==='function'&&
      typeof win.NGTDashboardData.lowFood==='function'
     )
    );
    record('NGTTaxonomy verfügbar',!!win.NGTTaxonomy);
    record(
     'Taxonomie-Teilmodule verfügbar',
     !!(
      win.NGTTaxonomyInternal&&
      win.NGTTaxonomyInternal.core&&
      win.NGTTaxonomyInternal.store&&
      win.NGTTaxonomyInternal.cloud
     )
    );
    record(
     'Taxonomie-UI-Teilmodule verfügbar',
     !!(
      win.NGTTaxonomyUIInternal&&
      win.NGTTaxonomyUIInternal.illustrations&&
      win.NGTTaxonomyUIInternal.decoration
     )
    );
    record('NGTAIQuery verfügbar',!!win.NGTAIQuery);
    record('NGTAnimals verfügbar',!!win.NGTAnimals);
    record(
     'Animals-Teilmodule verfügbar',
     !!(
      win.NGTAnimalsInternal&&
      win.NGTAnimalsInternal.food&&
      win.NGTAnimalsInternal.stock&&
      win.NGTAnimalsInternal.editor
     )
    );
    record(
     'Nachzuchten-Teilmodule verfügbar',
     !!(
      win.NGTOffspring&&
      typeof win.NGTOffspring.save==='function'&&
      typeof win.NGTOffspring.openEditor==='undefined'&&
      typeof win.NGTOffspring.remove==='undefined'&&
      win.NGTOffspringInternal&&
      win.NGTOffspringInternal.editor
     )
    );

    record(
     'Keine veralteten Parallelmodule aktiv',
     !(
      win.NGTCloudBackup||
      win.NGTCloudSync||
      win.NGTTimeline||
      win.NGTTimeline2
     )
    );

    const modules=win.NGT500&&win.NGT500.modules||{};

    record(
     'Profil-Historienmodul verfügbar',
     !!(
      win.NGTProfileInternal&&
      win.NGTProfileInternal.history
     )
    );

    expectedModules.forEach(function(name){
     record('Modul registriert: '+name,!!modules[name]);
    });

    record(
     'App-Root gerendert',
     !!frame.contentDocument.getElementById('app')
    );

    record(
     'Store-Daten abrufbar',
     !!(win.NGTStore&&typeof win.NGTStore.data==='function'&&win.NGTStore.data())
    );

    record(
     'Veraltete Futter-Schreibpfade entfernt',
     !!(
      win.NGTStore&&
      typeof win.NGTStore.addFood==='undefined'&&
      typeof win.NGTStore.reduceFood==='undefined'
     )
    );

    record(
     'UUID-basierte Store-API verfügbar',
     !!(
      win.NGTStore&&
      typeof win.NGTStore.animalId==='function'&&
      typeof win.NGTStore.resolveAnimal==='function'&&
      typeof win.NGTStore.getAnimalById==='function'&&
      typeof win.NGTStore.updateAnimalById==='function'&&
      typeof win.NGTStore.deleteAnimalById==='function'&&
      typeof win.NGTStore.addAnimalPhoto==='function'&&
      typeof win.NGTStore.setAnimalCoverPhoto==='function'&&
      typeof win.NGTStore.deleteAnimalPhoto==='function'&&
      typeof win.NGTStore.replaceAnimalPhotos==='function'&&
      typeof win.NGTStore.setAnimalDefaultFeeder==='function'&&
      typeof win.NGTStore.saveFoodInventoryItem==='function'&&
      typeof win.NGTStore.adjustFoodInventoryItem==='function'&&
      typeof win.NGTStore.deleteFoodInventoryItem==='function'&&
      typeof win.NGTStore.saveSellerProfile==='function'&&
      typeof win.NGTStore.exportBackup==='function'&&
      typeof win.NGTStore.importBackup==='function'&&
      typeof win.NGTStore.recordFeed==='function'&&
      typeof win.NGTStore.recordWeight==='function'&&
      typeof win.NGTStore.recordShed==='function'&&
      typeof win.NGTStore.recordHealth==='function'&&
      typeof win.NGTStore.updateFoodStock==='function'&&
      typeof win.NGTStore.deleteHistoryEntry==='function'
     )
    );

    record(
     'AnimalEngine-Basisfunktion ausführbar',
     !!(
      win.AnimalEngine&&
      win.AnimalEngine.getScientificName({genus:'Python',species:'regius'})==='Python regius'&&
      typeof win.AnimalEngine.normalizeFeedEvent==='function'&&
      typeof win.AnimalEngine.formatFeedEvent==='function'
     )
    );

    record(
     'Futterbestandsregeln ausführbar',
     !!(
      win.FoodInventoryEngine&&
      win.FoodInventoryEngine.needsRestock({
       qty:5,
       minimum:5
      })===true&&
      win.FoodInventoryEngine.needsRestock({
       qty:6,
       minimum:5
      })===false
     )
    );

    record(
     'Pflege- und Fälligkeitsregeln ausführbar',
     !!(
      win.CareRulesEngine&&
      win.CareRulesEngine.isFeedDue({
       feedIntervalEnabled:false,
       feedIntervalDays:14,
       feeds:[]
      })===false&&
      win.CareRulesEngine.isFeedDue({
       feedIntervalDays:14,
       feeds:[]
      })===true
     )
    );

    record(
     'Synchronisationsregeln schützen lokale Daten',
     !!(
      win.NGTSyncPolicyEngine&&
      win.NGTSyncPolicyEngine.decide({
       localData:{
        animals:[{uuid:'local'}]
       },
       cloudData:{},
       cloudExists:false
      }).action==='keep-local'&&
      win.NGTSyncPolicyEngine.decide({
       localData:{},
       cloudData:{
        animals:[{uuid:'cloud'}]
       },
       cloudExists:true
      }).action==='load-cloud'
     )
    );

    const aiAnswer=
     win.NGTAIQuery&&
     win.NGTAIQuery.query(
      'welche tiere muessen gefuettert?'
     );

    record(
     'AI-Abfrage ausführbar',
     !!(
      aiAnswer&&
      Array.isArray(aiAnswer.rows)
     )
    );
   }catch(error){
    record('Runtime-Prüfung',false,error.message);
   }
   resolve();
  }

  frame.addEventListener(
   'load',
   inspectFrame,
   {once:true}
  );

  try{
   if(
    frame.contentDocument&&
    frame.contentDocument.readyState==='complete'&&
    /\/v500\.html(?:[?#]|$)/.test(
     frame.contentWindow.location.href
    )
   ){
    setTimeout(inspectFrame,0);
   }
  }catch(error){}
 });
}

async function run(){
 try{
  await testAssets();
 }catch(error){
  record('Asset-Prüfung',false,error.message);
 }

 await testRuntime();
 render();
}

run();
})();
</script>
</body>
</html>
