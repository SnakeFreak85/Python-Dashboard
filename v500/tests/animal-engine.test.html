<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimalEngine Tests</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 16px;background:#0d1722;color:#f5f7fb}
.pass{color:#69d2c4}.fail{color:#ff7b7b}code{background:#172331;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<h1>AnimalEngine Browser Tests</h1>
<div id="results"></div>
<script src="../animal-engine.js"></script>
<script src="../care-rules-engine.js"></script>
<script>
(function(){
'use strict';

const results=[];

function assert(name,condition,details){
 results.push({name:name,ok:!!condition,details:details||''});
}

function equal(name,actual,expected){
 assert(
  name,
  Object.is(actual,expected),
  'Erwartet: '+JSON.stringify(expected)+', erhalten: '+JSON.stringify(actual)
 );
}

const fullAnimal={
 name:'Luna',
 animalGroup:'Schlangen',
 genus:'Python',
 species:'regius',
 birth:'2025-01-01',
 feedIntervalDays:14,
 weightIntervalDays:30,
 feeds:[
  {date:'2026-01-01',accepted:true},
  {date:'2026-03-01',accepted:false},
  {date:'2026-02-01',accepted:true}
 ]
};

equal('Name wird gelesen',AnimalEngine.getName(fullAnimal),'Luna');
equal('Wissenschaftlicher Name',AnimalEngine.getScientificName(fullAnimal),'Python regius');
equal('Fallback auf Tiergruppe',AnimalEngine.getScientificName({animalGroup:'Geckos'}),'Geckos');
equal('Anzeigename bevorzugt Namen',AnimalEngine.getDisplayName(fullAnimal),'Luna');
equal('Geburtsdatum-Fallback',AnimalEngine.getBirthDate(fullAnimal),'2025-01-01');
equal('Alter in Tagen ist deterministisch',AnimalEngine.getAgeDays(fullAnimal,'2025-01-31'),30);
equal('Alterstext unter 365 Tagen',AnimalEngine.getAgeText(fullAnimal,'2025-02-01'),'1 Monate');
equal('Profil-Alter unter einem Jahr',AnimalEngine.getAgeYearsText(fullAnimal,'2025-02-01'),'< 1 Jahr');
equal('Profil-Alter in Jahren',AnimalEngine.getAgeYearsText(fullAnimal,'2027-02-01'),'2 Jahre');
equal('Profil-Alter ohne Datum',AnimalEngine.getAgeYearsText({},'2027-02-01'),'-');
equal('Neuester Historieneintrag',AnimalEngine.latest(fullAnimal.feeds).date,'2026-03-01');
equal('Tage seit Datum',AnimalEngine.daysSince('2026-01-01','2026-01-11'),10);
equal('Ungültiges Datum liefert null',AnimalEngine.daysSince('ungültig','2026-01-11'),null);
equal('Profil-Fallback für ungültiges Datum',AnimalEngine.daysSinceOr('ungültig',9999,'2026-01-11'),9999);
equal('Profil-Fallback wird bei gültigem Datum ignoriert',AnimalEngine.daysSinceOr('2026-01-01',9999,'2026-01-11'),10);
equal('Fütterungsintervall',AnimalEngine.getFeedInterval(fullAnimal),14);
equal('Gewichtsintervall',AnimalEngine.getWeightInterval(fullAnimal),30);
equal('Deaktiviertes Fütterungsintervall',AnimalEngine.getFeedInterval({feedIntervalEnabled:false,feedIntervalDays:14}),null);

equal(
 'Deaktiviertes Intervall erzeugt keine Fütterungsaufgabe',
 CareRulesEngine.isFeedDue({
  feedIntervalEnabled:false,
  feedIntervalDays:14,
  feeds:[{date:'2026-01-01'}]
 },{now:'2026-07-28'}),
 false
);

const missingFeedState=CareRulesEngine.feedDueState({
 feedIntervalDays:14,
 feeds:[]
},{now:'2026-07-28'});

equal('Aktives Intervall ohne Historie ist fällig',missingFeedState.due,true);
equal('Fehlende Historie wird gekennzeichnet',missingFeedState.missing,true);
equal(
 'Erreichtes Fütterungsintervall ist fällig',
 CareRulesEngine.isFeedDue({
  feedIntervalDays:14,
  feeds:[{date:'2026-07-14'}]
 },{now:'2026-07-28'}),
 true
);
equal(
 'Nicht erreichtes Fütterungsintervall ist nicht fällig',
 CareRulesEngine.isFeedDue({
  feedIntervalDays:14,
  feeds:[{date:'2026-07-15'}]
 },{now:'2026-07-28'}),
 false
);
equal(
 'Deaktiviertes Gewichtsintervall erzeugt keine Aufgabe',
 CareRulesEngine.isWeightDue({
  weightIntervalEnabled:false,
  weightIntervalDays:30,
  weights:[]
 },{now:'2026-07-28'}),
 false
);
equal(
 'Deaktivierte Intervalle belasten Gesundheitsstatus nicht',
 CareRulesEngine.healthStatus({
  feedIntervalEnabled:false,
  feeds:[{date:'2026-01-01',accepted:true}],
  weightIntervalEnabled:false,
  weights:[],
  health:[]
 },{now:'2026-07-28'}).score,
 0
);
equal(
 'Zwei Verweigerungen ergeben Beobachten',
 CareRulesEngine.healthStatus({
  feedIntervalEnabled:false,
  feeds:[
   {date:'2026-07-20',accepted:false},
   {date:'2026-07-27',accepted:false}
  ],
  weightIntervalEnabled:false,
  weights:[],
  health:[]
 },{now:'2026-07-28'}).txt,
 'Beobachten'
);
equal(
 'Verweigerungen plus Gewichtsverlust ergeben Handlungsbedarf',
 CareRulesEngine.healthStatus({
  feedIntervalEnabled:false,
  feeds:[
   {date:'2026-07-20',accepted:false},
   {date:'2026-07-27',accepted:false}
  ],
  weightIntervalEnabled:false,
  weights:[
   {date:'2026-07-01',weight:150},
   {date:'2026-07-28',weight:140}
  ],
  health:[]
 },{now:'2026-07-28'}).txt,
 'Handlungsbedarf'
);

const legacyProfileFeed=AnimalEngine.normalizeFeedEvent({
 date:'2026-07-27',
 accepted:true,
 prey:'Ratte',
 amount:1,
 size:'150 g',
 unit:'Stück'
});

equal('Legacy-Profilfütterung behält 150 g',legacyProfileFeed.preyWeightGrams,150);
equal('Legacy-Profilfütterung hat Menge 1',legacyProfileFeed.quantity,1);
equal('Legacy-Profilfütterung wird korrekt formatiert',AnimalEngine.formatFeedEvent(legacyProfileFeed),'Gefressen Ratte 150 g');

const legacyQuickFeed=AnimalEngine.normalizeFeedEvent({
 accepted:true,
 prey:'Ratte',
 amount:150
});

equal('Legacy-Schnelleingabe übernimmt Gewicht',legacyQuickFeed.preyWeightGrams,150);
equal('Legacy-Schnelleingabe erhält Standardmenge',legacyQuickFeed.quantity,1);

const canonicalFeed=AnimalEngine.createFeedEvent({
 accepted:true,
 condition:'Frost',
 prey:'Ratte',
 variantLabel:'150 g',
 preyWeightGrams:150,
 quantity:1,
 deductStock:true,
 inventoryLabel:'Frost Ratte 150 g'
});

equal('Kanonisches Kompatibilitätsfeld ist Gewicht',canonicalFeed.amount,150);
equal('Technische Speicheroption wird nicht persistiert',canonicalFeed.deductStock,undefined);
equal('Kanonische Anzeige ist einheitlich',AnimalEngine.formatFeedEvent(canonicalFeed),'Gefressen Frost Ratte 150 g');
equal(
 'Mehrere Futtertiere werden als Menge formatiert',
 AnimalEngine.formatFeedEvent({...canonicalFeed,quantity:2}),
 'Gefressen 2 × Frost Ratte 150 g'
);
equal(
 'Futterverweigerung wird eindeutig formatiert',
 AnimalEngine.formatFeedEvent({...canonicalFeed,accepted:false}),
 'Verweigert Frost Ratte 150 g'
);

const weightEvent=AnimalEngine.createWeightEvent({
 id:'weight-1',
 date:'2026-07-28',
 weight:'150.5',
 source:'profile',
 note:'Kontrolle'
});

equal('Gewichtseintrag normalisiert Zahlen',weightEvent.weight,150.5);
equal('Gewichtseintrag erhält Quelle',weightEvent.source,'profile');
equal('Ungültiges Gewicht wird abgelehnt',AnimalEngine.createWeightEvent({weight:0}),null);

const shedEvent=AnimalEngine.createShedEvent({
 id:'shed-1',
 date:'2026-07-27',
 note:'Vollständig'
});

equal('Häutung ist standardmäßig vollständig',shedEvent.complete,true);
equal('Häutungsnotiz bleibt erhalten',shedEvent.note,'Vollständig');

const healthEvent=AnimalEngine.createHealthEvent({
 id:'health-1',
 date:'2026-07-26',
 title:'Kontrolle',
 medication:'Medikament A'
});

equal('Gesundheit erhält Standardtyp',healthEvent.type,'Gesundheit');
equal('Gesundheit erhält Standardstatus',healthEvent.status,'offen');
equal('Gesundheitsfelder bleiben erhalten',healthEvent.medication,'Medikament A');

const legacyAnimal={name:'Altbestand'};
const normalized=AnimalEngine.ensureHistories(legacyAnimal);
assert(
 'Historien werden initialisiert',
 ['health','photos','feeds','sheds','weights'].every(function(key){
  return Array.isArray(normalized[key]);
 })
);
assert('Bestehende Felder bleiben erhalten',normalized.name==='Altbestand');

const repeat=AnimalEngine.ensureHistories(normalized);
assert('Normalisierung ist wiederholbar',repeat===normalized);

const box=document.getElementById('results');
const passed=results.filter(function(result){return result.ok;}).length;
box.innerHTML='<p><strong>'+passed+' / '+results.length+' Tests bestanden</strong></p>'+results.map(function(result){
 return '<p class="'+(result.ok?'pass':'fail')+'">'+(result.ok?'✓':'✗')+' '+result.name+(result.ok||!result.details?'':' — '+result.details)+'</p>';
}).join('');

document.title=passed===results.length?'PASS: AnimalEngine Tests':'FAIL: AnimalEngine Tests';
})();
</script>
</body>
</html>
