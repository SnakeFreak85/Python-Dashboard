<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store Tests</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;background:#0d1722;color:#f8fafc}
.pass{color:#86efac}.fail{color:#fca5a5}.muted{color:#94a3b8}li{margin:7px 0}
</style>
</head>
<body>
<h1>Store Browser Tests</h1>
<p class="muted">Prüft Legacy-Import, kanonischen Tierbestand und zuverlässiges Löschen.</p>
<p id="summary">Test läuft …</p>
<ol id="results"></ol>

<script>
(function(){
'use strict';

window.__storeTestOriginal=localStorage.getItem('spd_v53');

localStorage.setItem('spd_v53',JSON.stringify({
 schemaVersion:2,
 animals:[],
 koenig:[{
  uuid:'legacy-1',
  uid:'legacy-1',
  name:'Legacy-Tier',
  animalGroup:'Königspythons',
  genus:'Python',
  species:'regius',
  status:'Bestand'
 }],
 boas:[],
 geckos:[],
 spinnen:[],
 foodInventory:[],
 clutches:[],
 sales:[],
 archive:[],
 settings:{}
}));
})();
</script>

<script src="../core.js"></script>
<script src="../id-manager.js"></script>
<script src="../food-inventory-engine.js"></script>
<script src="../animal-engine.js"></script>
<script src="../store.js"></script>

<script>
(function(){
'use strict';

const results=[];

function record(name,passed,detail){
 results.push({name:name,passed:!!passed,detail:detail||''});
}

function equal(name,actual,expected){
 record(
  name,
  Object.is(actual,expected),
  'Erwartet: '+JSON.stringify(expected)+', erhalten: '+JSON.stringify(actual)
 );
}

function render(){
 const failed=results.filter(function(result){
  return !result.passed;
 }).length;

 document.getElementById('summary').textContent=
  failed
   ?failed+' von '+results.length+' Prüfungen fehlgeschlagen.'
   :results.length+' Prüfungen erfolgreich.';

 document.getElementById('results').innerHTML=results.map(function(result){
  return '<li class="'+(result.passed?'pass':'fail')+'">'+
   (result.passed?'PASS':'FAIL')+' — '+result.name+
   (result.passed||!result.detail?'':' <span class="muted">('+result.detail+')</span>')+
   '</li>';
 }).join('');

 document.title=failed?'FAIL — Store Tests':'PASS — Store Tests';
}

try{
 const foodSource={
  label:'Frost Ratte 150 g',
  qty:5
 };
 const normalizedFood=
  FoodInventoryEngine.normalizeItem(foodSource);

 equal(
  'Fehlender Mindestbestand wird zentral auf 5 gesetzt',
  normalizedFood.minimum,
  5
 );

 equal(
  'Lesende Normalisierung verändert Quelldaten nicht',
  Object.hasOwn(foodSource,'minimum'),
  false
 );

 equal(
  'Leerer Bestand gilt auch bei Minimum 0 als Nachkauf',
  FoodInventoryEngine.needsRestock({
   label:'Heimchen',
   qty:0,
   minimum:0
  }),
  true
 );

 equal(
  'Positiver Bestand ist bei Minimum 0 ausreichend',
  FoodInventoryEngine.needsRestock({
   label:'Heimchen',
   qty:1,
   minimum:0
  }),
  false
 );

 equal(
  'Benutzerdefinierter Mindestbestand wird berücksichtigt',
  FoodInventoryEngine.needsRestock({
   label:'Frost Maus 20 g',
   qty:7,
   minimum:7
  }),
  true
 );

 equal(
  'Legacy-only Bestand wird beim Laden übernommen',
  NGTStore.allAnimals().length,
  1
 );

 equal(
  'Legacy-Tier behält seine UUID',
  NGTStore.allAnimals()[0].a.uuid,
  'legacy-1'
 );

 NGTStore.deleteAnimal('',0);

 equal(
  'Zentrale Löschung entfernt das Tier',
  NGTStore.allAnimals().length,
  0
 );

 equal(
  'Legacy-Liste wird nach Löschung neu aufgebaut',
  NGTStore.data().koenig.length,
  0
 );

 equal(
  'Löschung steht im persistierten kanonischen Bestand',
  JSON.parse(localStorage.getItem('spd_v53')).animals.length,
  0
 );

 NGTStore.save();

 equal(
  'Weiteres Speichern stellt das Tier nicht wieder her',
  NGTStore.allAnimals().length,
  0
 );

 equal(
  'Dokumentensammlung wird zentral initialisiert',
  Array.isArray(NGTStore.data().documents),
  true
 );

 NGTStore.addAnimal('',{
  uuid:'offspring-1',
  uid:'offspring-1',
  name:'Nachzucht',
  animalGroup:'Königspythons',
  genus:'Python',
  species:'regius',
  status:'Nachzucht',
  collection:'offspring'
 });

 equal(
  'Nachzucht wurde angelegt',
  NGTStore.allOffspring().length,
  1
 );

 NGTStore.deleteAnimal('',0);

 equal(
  'Nachzucht bleibt nach zentraler Löschung entfernt',
  NGTStore.allOffspring().length,
  0
 );

 NGTStore.importJson(JSON.stringify({
  schemaVersion:2,
  animals:[{
   uuid:'mixed-1',
   uid:'mixed-1',
   name:'Kanonisch',
   animalGroup:'Boas',
   status:'Bestand'
  }],
  boas:[{
   uuid:'mixed-1',
   uid:'mixed-1',
   name:'Legacy-Duplikat',
   animalGroup:'Boas',
   status:'Bestand'
  }],
  koenig:[],
  geckos:[],
  spinnen:[]
 }));

 equal(
  'Gemischter Import dupliziert gleiche UUID nicht',
  NGTStore.allAnimals().length,
  1
 );

 equal(
  'Kanonischer Datensatz hat beim gemischten Import Vorrang',
  NGTStore.allAnimals()[0].a.name,
  'Kanonisch'
 );

 equal(
  'Legacy-Kompatibilitätsliste wird aus animals[] erzeugt',
  NGTStore.data().boas.length,
  1
 );

 NGTStore.addAnimal('',{
  uuid:'mixed-2',
  uid:'mixed-2',
  name:'Zweites Tier',
  animalGroup:'Boas',
  status:'Bestand'
 });

 NGTStore.data().animals.reverse();
 NGTStore.save();

 equal(
  'UUID-Auflösung ist unabhängig von der Array-Position',
  NGTStore.getAnimalById('mixed-1').name,
  'Kanonisch'
 );

 equal(
  'UUID-Route wird zum richtigen Tier aufgelöst',
  NGTStore.resolveAnimal({animalId:'mixed-1'}).a.name,
  'Kanonisch'
 );

 equal(
  'Legacy-Index bleibt als Fallback funktionsfähig',
  NGTStore.resolveAnimal({i:0}).a.name,
  'Zweites Tier'
 );

 equal(
  'Aktualisieren über UUID funktioniert',
  NGTStore.updateAnimalById(
   'mixed-1',
   {name:'Über UUID aktualisiert'}
  ).name,
  'Über UUID aktualisiert'
 );

 equal(
  'Löschen über UUID ist erfolgreich',
  NGTStore.deleteAnimalById('mixed-1'),
  true
 );

 equal(
  'Gelöschte UUID ist nicht mehr auflösbar',
  NGTStore.getAnimalById('mixed-1'),
  null
 );

 equal(
  'Anderes Tier bleibt nach UUID-Löschung erhalten',
  NGTStore.getAnimalById('mixed-2').name,
  'Zweites Tier'
 );

 NGTStore.replaceAnimalPhotos(
  {animalId:'mixed-2'},
  [
   {data:'data:image/png;base64,AA',cover:true},
   {url:'https://example.invalid/photo.jpg',cover:true}
  ]
 );

 const normalizedPhotos=
  NGTStore.getAnimalById('mixed-2').photos;

 record(
  'Importierte Fotos erhalten stabile IDs',
  normalizedPhotos.every(function(photo){
   return !!photo.id;
  })
 );

 equal(
  'Fotoliste erhaelt genau ein Titelbild',
  normalizedPhotos.filter(function(photo){
   return photo.cover;
  }).length,
  1
 );

 equal(
  'Erstes nutzbares Foto wird Titelbild',
  normalizedPhotos[0].cover,
  true
 );

 NGTStore.data().foodInventory.push({
  id:'food-150',
  category:'Nagetiere',
  condition:'Frost',
  itemName:'Ratte',
  variant:'150 g',
  unit:'Stück',
  qty:2,
  label:'Frost Ratte 150 g'
 });
 NGTStore.save();

 const detachedInventory=
  NGTStore.foodInventory();

 detachedInventory[0].qty=999;
 detachedInventory.push({
  id:'detached-only'
 });

 equal(
  'Futterbestandsleser schützt Einträge vor direkter Änderung',
  NGTStore.data().foodInventory[0].qty,
  2
 );
 equal(
  'Futterbestandsleser schützt die Liste vor direkter Änderung',
  NGTStore.data().foodInventory.length,
  1
 );

 const detachedDocuments=
  NGTStore.documents();
 detachedDocuments.push({
  id:'detached-document'
 });

 equal(
  'Dokumentenleser liefert eine getrennte Liste',
  NGTStore.data().documents.length,
  0
 );

 const detachedSettings=
  NGTStore.settings();
 detachedSettings.testValue=true;

 equal(
  'Einstellungsleser liefert ein getrenntes Objekt',
  NGTStore.data().settings.testValue,
  undefined
 );

 const recordedFeed=NGTStore.recordFeed(
  {animalId:'mixed-2'},
  {
   date:'2026-07-27',
   accepted:true,
   foodInventoryId:'food-150',
   condition:'Frost',
   prey:'Ratte',
   variantLabel:'150 g',
   preyWeightGrams:150,
   quantity:1,
   source:'test',
   deductStock:true
  }
 );

 equal(
  'Zentraler Fütterungspfad speichert 150 g',
  recordedFeed.event.preyWeightGrams,
  150
 );

 equal(
  'Stückzahl wird getrennt vom Gewicht gespeichert',
  recordedFeed.event.quantity,
  1
 );

 equal(
  'Fütterung wird überall gleich formatiert',
  AnimalEngine.formatFeedEvent(recordedFeed.event),
  'Gefressen Frost Ratte 150 g'
 );

 equal(
  'Gefressene Portion reduziert den Futterbestand',
  NGTStore.data().foodInventory[0].qty,
  1
 );

 NGTStore.recordFeed(
  {animalId:'mixed-2'},
  {
   accepted:false,
   foodInventoryId:'food-150',
   condition:'Frost',
   prey:'Ratte',
   variantLabel:'150 g',
   preyWeightGrams:150,
   quantity:1,
   deductStock:true
  }
 );

 equal(
  'Verweigertes Futter reduziert den Bestand nicht',
  NGTStore.data().foodInventory[0].qty,
  1
 );

 equal(
  'Verpaarungsdaten werden additiv initialisiert',
  Array.isArray(NGTStore.data().breedingPlans),
  true
 );

 const breedingPlan=NGTStore.saveBreedingPlan({
  id:'breeding-test-1',
  projectCode:'KP-2026-01',
  status:'planned',
  fatherId:'father-1',
  motherId:'mother-1',
  events:[]
 });

 equal(
  'Verpaarung wird UUID-basiert gespeichert',
  breedingPlan.id,
  'breeding-test-1'
 );

 equal(
  'Verpaarung ist getrennt abrufbar',
  NGTStore.breedingPlanById('breeding-test-1').projectCode,
  'KP-2026-01'
 );

 breedingPlan.events.push({
  id:'event-1',
  type:'pairing',
  date:'2026-08-06'
 });

 NGTStore.saveBreedingPlan(breedingPlan);

 equal(
  'Verpaarungsverlauf bleibt beim Aktualisieren erhalten',
  NGTStore.breedingPlanById('breeding-test-1').events.length,
  1
 );

 equal(
  'Verpaarungsdaten sind im Cloud- und Backup-Snapshot enthalten',
  NGTStore.snapshot().breedingPlans.length,
  1
 );

 equal(
  'Verpaarung kann gezielt entfernt werden',
  NGTStore.deleteBreedingPlan('breeding-test-1').id,
  'breeding-test-1'
 );

 equal(
  'Ungültiger Index löst keine Löschung aus',
  NGTStore.deleteAnimal('',-1),
  false
 );

 equal(
  'Ungültiger Index verändert den Bestand nicht',
  NGTStore.allAnimals().length,
  1
 );

}catch(error){
 record(
  'Testlauf ohne Ausnahme',
  false,
  error&&error.stack?error.stack:error.message
 );
}finally{
 if(window.__storeTestOriginal===null){
  localStorage.removeItem('spd_v53');
 }else{
  localStorage.setItem(
   'spd_v53',
   window.__storeTestOriginal
  );
 }

 render();
}

})();
</script>
</body>
</html>
