<script>
(function(){
 try{
  var theme=
   localStorage.getItem(
    'terracontrol_theme_v1'
   )==='light'
    ?'light'
    :'dark';

  document.documentElement.dataset.tcTheme=theme;
  document.documentElement.style.colorScheme=theme;
 }catch(error){
  document.documentElement.dataset.tcTheme='dark';
 }
})();
</script>
