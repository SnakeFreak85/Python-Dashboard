<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Dashboard V21</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#243447;color:#fff;padding:15px;text-align:center}
.card{background:#fff;margin:10px;padding:15px;border-radius:10px}
input,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
let animals=JSON.parse(localStorage.getItem('animals_v21')||'[]');

function addAnimal(){
 animals.push({
  name:animalName.value,
  species:animalSpecies.value,
  morph:animalMorph.value
 });
 localStorage.setItem('animals_v21',JSON.stringify(animals));
 renderAnimals();
}

function deleteAnimal(i){
 animals.splice(i,1);
 localStorage.setItem('animals_v21',JSON.stringify(animals));
 renderAnimals();
}

function renderAnimals(){
 const el=document.getElementById('animalList');
 if(!el) return;
 el.innerHTML=animals.map((a,i)=>
 `<div class="card"><b>${a.name}</b> • ${a.morph}<br>${a.species}<br><button onclick="deleteAnimal(${i})">Löschen</button></div>`
 ).join('');
}

renderAnimals();
</script>
</head>
<body>
<header><h2>🐍 Python Dashboard V21</h2></header>

<div class="card">
<h3>⚙️ Verkäuferdaten</h3>
<input id="sellerName" placeholder="Name">
<input id="sellerAddress" placeholder="Adresse">
<input id="sellerCity" placeholder="PLZ / Ort">
<button onclick="saveSeller()">Speichern</button>
</div>

<div class="card">
<hr>
<h3>🐍 Bestand</h3>
<input id="animalName" placeholder="Name">
<input id="animalSpecies" placeholder="Tierart">
<input id="animalMorph" placeholder="Morph">
<button onclick="addAnimal()">Tier speichern</button>
<div id="animalList"></div>
<h3>📄 Test-Abgabenachweis</h3>
<button onclick="createPDF()">PDF erstellen</button>
</div>

<script>
function saveSeller(){
 localStorage.setItem('seller',JSON.stringify({
  name:sellerName.value,
  address:sellerAddress.value,
  city:sellerCity.value
 }));
 alert('Gespeichert');
}

function createPDF(){
 const seller=JSON.parse(localStorage.getItem('seller')||'{}');
 const buyer=prompt('Käufer Name');
 if(!buyer) return;

 const {jsPDF}=window.jspdf;
 const doc=new jsPDF();

 doc.setFontSize(22);
 doc.text('ABGABENACHWEIS',20,20);

 doc.setFontSize(12);
 doc.text('Verkäufer',20,40);
 doc.setFontSize(11);
 doc.text(seller.name||'-',20,50);
 doc.text(seller.address||'-',20,58);
 doc.text(seller.city||'-',20,66);

 doc.setFontSize(12);
 doc.text('Käufer',120,40);
 doc.setFontSize(11);
 doc.text(buyer,120,50);

 doc.line(20,95,190,95);

 doc.text('Name: Beispieltier',20,115);
 doc.text('Art: Königspython',20,125);
 doc.text('Morph: Beispiel Morph',20,135);

 doc.line(20,275,90,275);
 doc.text('Unterschrift Verkäufer',20,283);

 doc.line(120,275,190,275);
 doc.text('Unterschrift Käufer',120,283);

 doc.save('Abgabenachweis.pdf');
}

let animals=JSON.parse(localStorage.getItem('animals_v21')||'[]');

function addAnimal(){
 animals.push({
  name:animalName.value,
  species:animalSpecies.value,
  morph:animalMorph.value
 });
 localStorage.setItem('animals_v21',JSON.stringify(animals));
 renderAnimals();
}

function deleteAnimal(i){
 animals.splice(i,1);
 localStorage.setItem('animals_v21',JSON.stringify(animals));
 renderAnimals();
}

function renderAnimals(){
 const el=document.getElementById('animalList');
 if(!el) return;
 el.innerHTML=animals.map((a,i)=>
 `<div class="card"><b>${a.name}</b> • ${a.morph}<br>${a.species}<br><button onclick="deleteAnimal(${i})">Löschen</button></div>`
 ).join('');
}

renderAnimals();
</script>
</body>
</html>
