<script>
let snakes=JSON.parse(localStorage.getItem("kp_manager_v18")||"[]");
let projects=JSON.parse(localStorage.getItem("kp_projects_v18")||"[]");
let currentSnake=null,currentProject=null;
let sellerSettings=JSON.parse(localStorage.getItem('python_settings_v20')||'{"name":"","address":"","city":"","phone":"","mail":""}');

function saveSellerSettings(){
 sellerSettings={
  name:document.getElementById('sellerName').value,
  address:document.getElementById('sellerAddress').value,
  city:document.getElementById('sellerCity').value,
  phone:document.getElementById('sellerPhone').value,
  mail:document.getElementById('sellerMail').value
 };
 localStorage.setItem('python_settings_v20',JSON.stringify(sellerSettings));
 alert('Verkäuferdaten gespeichert');
}

function loadSellerSettings(){
 if(!document.getElementById('sellerName')) return;
 document.getElementById('sellerName').value=sellerSettings.name||'';
 document.getElementById('sellerAddress').value=sellerSettings.address||'';
 document.getElementById('sellerCity').value=sellerSettings.city||'';
 document.getElementById('sellerPhone').value=sellerSettings.phone||'';
 document.getElementById('sellerMail').value=sellerSettings.mail||'';
}



function compressImage(file, callback){
 const img=new Image();
 const reader=new FileReader();
 reader.onload=function(e){
   img.onload=function(){
     let canvas=document.createElement('canvas');
     let max=800;
     let w=img.width,h=img.height;
     if(w>h && w>max){h*=max/w;w=max;}
     if(h>w && h>max){w*=max/h;h=max;}
     canvas.width=w; canvas.height=h;
     canvas.getContext('2d').drawImage(img,0,0,w,h);
     callback(canvas.toDataURL('image/jpeg',0.7));
   };
   img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}

const feederMap={
'Königspython':['Springer','Fuzzy Maus','Kleine Maus','Maus','Weaner','Kleine Ratte','Mittlere Ratte','Große Ratte','Jumbo Ratte'],
'Leopardgecko':['Heimchen','Grillen','Schaben','Heuschrecken','Mehlwürmer','Zophobas','Wachsmaden'],
'Bartagame':['Heimchen','Grillen','Schaben','Heuschrecken','Grünfutter','Kräuter','Salatmix'],
'Kornnatter':['Pinky','Fuzzy','Springer','Maus','Weaner'],
'Vogelspinne':['Heimchen','Schaben','Heuschrecken','Mehlwürmer'],
'Sonstige':['Futtertier']
};
function getFeeders(species){
 return feederMap[species]||feederMap['Sonstige'];
}

function save(){try{localStorage.setItem("kp_manager_v18",JSON.stringify(snakes));localStorage.setItem("kp_projects_v18",JSON.stringify(projects));}catch(e){alert("Speicherfehler: Zu viele Fotos/Daten gespeichert.");}render();}
function showTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');}



function previewNewPhoto(input){
 const file=input.files[0];
 if(!file) return;
 const r=new FileReader();
 r.onload=e=>{
   const img=document.getElementById('newPhotoPreview');
   if(img){img.src=e.target.result;img.style.display='block';}
 };
 r.readAsDataURL(file);
}

function saveSnakePhoto(input){

 const file=input.files[0];
 if(!file || !currentSnake) return;
 compressImage(file,function(data){
   currentSnake.photo=data;
   save();
   openSnake(currentSnake.id);
 });
}

function addSnake(){
 const file=snPhoto.files[0];
 const snake={
   id:Date.now(),
   name:snName.value,
   morph:snMorph.value,
   species:(document.getElementById('snSpecies')?.value||'Königspython'),gender:snGender.value,
   saleListed:false,
   birthDate:(snBirth.value||''),
   photo:'',
   feedingInterval:+snInterval.value||14,
   notes:'',
   breeder:'',
   origin:'',
   animalNumber:'',
   currentWeight:0,
   feedings:[],
   weights:[],
   sheds:[]
 };
 if(file){
   compressImage(file,function(data){
      snake.photo=data;
      snakes.push(snake);
      save();
   });
 }else{
   snakes.push(snake);
   save();
   snName.value=''; snMorph.value=''; snBirth.value='';
   snPhoto.value='';
   const p=document.getElementById('newPhotoPreview');
   if(p){p.style.display='none';p.src='';}
 }
}

function openSnake(id){
currentSnake=snakes.find(s=>s.id===id);
snakeDetail.style.display='block';
snakeDetail.innerHTML=`
<h3>${currentSnake.name}</h3><p><b>Art:</b> ${currentSnake.species||'Königspython'}</p><button onclick="createTransferDocument()">📄 Abgabenachweis</button><button onclick="createAnimalReport()">📊 Tierakte PDF</button><button onclick="deleteSnake(currentSnake.id)">🗑 Tier löschen</button>
    <div style="margin:10px 0">
    ${currentSnake.photo ? `<img src="${currentSnake.photo}" style="width:100%;max-width:250px;border-radius:10px">` : '📸 Kein Foto hinterlegt'}
    <input type="file" accept="image/*" onchange="saveSnakePhoto(this)">
    </div><p><b>Geburtsdatum:</b> ${currentSnake.birthDate||'-'}<br><b>Alter:</b> ${getAgeText(currentSnake.birthDate)}</p>

<h4>📝 Tierdaten</h4>
<input id="animalNumber" placeholder="Interne Tiernummer" value="${currentSnake.animalNumber||''}">
<input id="breeder" placeholder="Züchter" value="${currentSnake.breeder||''}">
<input id="origin" placeholder="Herkunft" value="${currentSnake.origin||''}">
<input id="mother" placeholder="Muttertier" value="${currentSnake.mother||''}">
<input id="father" placeholder="Vatertier" value="${currentSnake.father||''}">
<input id="clutchId" placeholder="Gelege-ID" value="${currentSnake.clutchId||''}">
<input id="projectName" placeholder="Projektname" value="${currentSnake.projectName||''}">
<input id="notes" placeholder="Bemerkungen" value="${currentSnake.notes||''}">
<button onclick="saveAnimalInfo()">Tierdaten speichern</button>

<h4>🍽 Fütterung</h4>

<input id="fd" type="date">
<select id="ft">${getFeeders(currentSnake.species||'Königspython').map(f=>`<option>${f}</option>`).join('')}</select>
<input id="fw" type="number" placeholder="Gewicht Futtertier">
<select id="fr"><option>Gefressen</option><option>Verweigert</option></select>
<button onclick="addFeed()">Speichern</button>
${(currentSnake.feedings||[]).map((f,i)=>`${f.date} | ${f.feeder||''} | ${f.feederWeight||''}g | ${f.result} <button onclick="delFeed(${i})">🗑</button><br>`).join('')}

<h4>⚖ Gewicht</h4>
<input id="wd" type="date"><input id="wv" type="number">
<button onclick="addWeight()">Speichern</button>
${(currentSnake.weights||[]).map((w,i)=>`${w.date} ${w.value}g <button onclick="delWeight(${i})">🗑</button><br>`).join('')}

<h4>🪶 Häutungen</h4>
<input id="sd" type="date">
<select id="ss"><option>Vollständig</option><option>Unvollständig</option></select>
<button onclick="addShed()">Speichern</button>
${(currentSnake.sheds||[]).map((s,i)=>`${s.date} | ${s.status} <button onclick="delShed(${i})">🗑</button><br>`).join('')}
`;
}

function saveAnimalInfo(){
 if(!currentSnake) return;
 currentSnake.animalNumber=document.getElementById('animalNumber').value;
 currentSnake.breeder=document.getElementById('breeder').value;
 currentSnake.origin=document.getElementById('origin').value;
 currentSnake.mother=document.getElementById('mother').value;
 currentSnake.father=document.getElementById('father').value;
 currentSnake.clutchId=document.getElementById('clutchId').value;
 currentSnake.projectName=document.getElementById('projectName').value;
 currentSnake.notes=document.getElementById('notes').value;
 save();
 openSnake(currentSnake.id);
}

function createAnimalReport(){
 if(!currentSnake) return;
 const { jsPDF } = window.jspdf;
 const doc=new jsPDF();
 doc.setFontSize(18);
 doc.text('Tierakte',20,20);
 doc.setFontSize(11);
 doc.text('Name: '+(currentSnake.name||''),20,40);
 doc.text('Art: '+(currentSnake.species||''),20,50);
 doc.text('Morph: '+(currentSnake.morph||''),20,60);
 doc.text('Tiernummer: '+(currentSnake.animalNumber||''),20,70);
 doc.text('Züchter: '+(currentSnake.breeder||''),20,80);
 doc.text('Herkunft: '+(currentSnake.origin||''),20,90);
 doc.text('Bemerkungen: '+(currentSnake.notes||''),20,100);

 let y=120;
 doc.text('Fütterungen',20,y); y+=10;
 (currentSnake.feedings||[]).forEach(f=>{doc.text(`${f.date} ${f.feeder} ${f.result}`,20,y); y+=8;});

 doc.addPage(); y=20;
 doc.text('Gewichte',20,y); y+=10;
 (currentSnake.weights||[]).forEach(w=>{doc.text(`${w.date} ${w.value}g`,20,y); y+=8;});

 doc.addPage(); y=20;
 doc.text('Häutungen',20,y); y+=10;
 (currentSnake.sheds||[]).forEach(s=>{doc.text(`${s.date} ${s.status}`,20,y); y+=8;});

 doc.save('Tierakte_'+(currentSnake.name||'Tier')+'.pdf');
}

function addFeed(){currentSnake.feedings.push({date:fd.value,feeder:ft.value,feederWeight:fw.value,result:fr.value});save();openSnake(currentSnake.id);}
function delFeed(i){currentSnake.feedings.splice(i,1);save();openSnake(currentSnake.id);}
function addWeight(){currentSnake.weights.push({date:wd.value,value:wv.value});currentSnake.currentWeight=+wv.value||0;save();openSnake(currentSnake.id);}
function delWeight(i){currentSnake.weights.splice(i,1);save();openSnake(currentSnake.id);}
function addShed(){currentSnake.sheds=currentSnake.sheds||[];currentSnake.sheds.push({date:sd.value,status:ss.value});save();openSnake(currentSnake.id);}
function delShed(i){currentSnake.sheds.splice(i,1);save();openSnake(currentSnake.id);}


function getAgeText(dateStr){
 if(!dateStr) return 'Unbekannt';
 const b=new Date(dateStr);
 const now=new Date();
 let years=now.getFullYear()-b.getFullYear();
 let months=now.getMonth()-b.getMonth();
 if(months<0){years--;months+=12;}
 return years+' J. '+months+' Mon.';
}


function createTransferDocument(){
 if(!currentSnake) return;
 const buyer=prompt('Name Käufer:');
 if(!buyer) return;
 const address=prompt('Adresse Käufer:','')||'';
 const city=prompt('PLZ / Ort Käufer:','')||'';
 const price=prompt('Preis (€):','')||'';
 const notes=prompt('Bemerkungen:','')||'';

 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();

 doc.setFontSize(20);
 doc.text('ABGABENACHWEIS',20,20);

 doc.setFontSize(12);
 doc.text('Verkäufer',20,40);
 doc.setFontSize(11);
 doc.text(sellerSettings.name||'-',20,50);
 doc.text(sellerSettings.address||'-',20,58);
 doc.text(sellerSettings.city||'-',20,66);
 doc.text(sellerSettings.phone||'-',20,74);
 doc.text(sellerSettings.mail||'-',20,82);

 doc.setFontSize(12);
 doc.text('Käufer',120,40);
 doc.setFontSize(11);
 doc.text(buyer,120,50);
 doc.text(address,120,58);
 doc.text(city,120,66);

 doc.line(20,95,190,95);

 doc.text('Name: '+(currentSnake.name||'-'),20,115);
 doc.text('Art: '+(currentSnake.species||'-'),20,125);
 doc.text('Morph: '+(currentSnake.morph||'-'),20,135);
 doc.text('Geschlecht: '+(currentSnake.gender||'-'),20,145);
 doc.text('Geburtsdatum: '+(currentSnake.birthDate||'-'),20,155);
 if(price) doc.text('Preis: '+price+' €',20,165);

 doc.text('Bemerkungen:',20,180);
 const lines=doc.splitTextToSize(notes||'-',170);
 doc.text(lines,20,190);

 doc.line(20,275,90,275);
 doc.text('Unterschrift Verkäufer',20,283);
 doc.line(120,275,190,275);
 doc.text('Unterschrift Käufer',120,283);

 doc.save('Abgabenachweis_'+(currentSnake.name||'Tier')+'.pdf');
}

function deleteCurrentProject(){
 if(currentProject===null) return;
 if(confirm('Projekt wirklich löschen?')){
   projects.splice(currentProject,1);
   currentProject=null;
   save();
   document.getElementById('projectDetail').style.display='none';
 }
}

function addProject(){projects.push({female:female.value,male:male.value,events:[],clutch:{eggs:0,slugs:0,hatched:0},hatchlings:[]});save();}

function openProject(i){
currentProject=i;
let p=projects[i];
if(!p.events) p.events=[];
if(!p.clutch) p.clutch={eggs:0,slugs:0,hatched:0};
if(!p.hatchlings) p.hatchlings=[];

let ov=p.events.find(e=>e.type==="Ovulation");
let forecast='';
if(ov && ov.date){
 let d=new Date(ov.date);
 let pre=new Date(d); pre.setDate(pre.getDate()+14);
 let lay=new Date(d); lay.setDate(lay.getDate()+30);
 let hatch=new Date(d); hatch.setDate(hatch.getDate()+85);
 forecast=`
 <p>
 🪶 Pre-Lay Shed: ${pre.toISOString().slice(0,10)}<br>
 🥚 Eiablage: ${lay.toISOString().slice(0,10)}<br>
 🐣 Schlupf: ${hatch.toISOString().slice(0,10)}
 </p>`;
}

projectDetail.style.display='block';
projectDetail.innerHTML=`
<h3>${p.female} × ${p.male}</h3>

<select id="etype">
<option>Kopulation</option>
<option>Ovulation</option>
<option>Pre-Lay Shed</option>
<option>Eiablage</option>
<option>Schlupf</option>
<option>Sonstiges</option>
</select>

<input id="edate" type="date">
<input id="edetail" placeholder="Notiz">
<button onclick="addEvent()">Ereignis speichern</button>

${forecast}

<h4>🧬 Timeline</h4>
${p.events.map((e,n)=>`${e.date} | ${e.type} | ${e.detail||''} <button onclick="delEvent(${n})">🗑</button><br>`).join('') || 'Keine Ereignisse'}

<hr>

<h4>🥚 Gelegeverwaltung</h4>
<input id="eggs" type="number" placeholder="Eier" value="${p.clutch.eggs||0}">
<input id="slugs" type="number" placeholder="Slugs" value="${p.clutch.slugs||0}">
<input id="hatched" type="number" placeholder="Geschlüpft" value="${p.clutch.hatched||0}">
<button onclick="saveClutch()">Gelege speichern</button>

<p><b>Schlupfquote:</b>
${(p.clutch.eggs-p.clutch.slugs)>0 ? ((p.clutch.hatched/(p.clutch.eggs-p.clutch.slugs))*100).toFixed(1) : 0}%
</p>

<h4>🐣 Nachzuchten</h4>
<label>🧬 Morph</label><input id="hMorph" placeholder="Morph">
<label>⚥ Geschlecht</label><select id="hGender">
<option>Unbestimmt</option>
<option>Weiblich</option>
<option>Männlich</option>
</select>
<label>⚖ Gewicht (g)</label><input id="hWeight" type="number" placeholder="Gewicht">
<label>📊 Status</label><select id="hStatus">
<option>Verfügbar</option>
<option>Reserviert</option>
<option>Bezahlt</option>
<option>Abgegeben</option>
</select>
<label>💰 Preis (€)</label><input id="hPrice" type="number" placeholder="Preis in €">
<label>👤 Käufer</label><input id="hBuyer" placeholder="Käufer">
<label>📱 Kontakt</label><input id="hContact" placeholder="Kontakt">
<label>📅 Schlupfdatum</label><input id="hBirth" type="date"><label>🥚 Gelege-ID</label><input id="hClutch" placeholder="Gelege-ID"><label>🧬 Projektname</label><input id="hProject" placeholder="Projektname"><label>📝 Notizen</label><input id="hNotes" placeholder="Notizen"><label>📅 Reserviert seit</label><input id="hReserved" type="date">
<button onclick="addHatchling()">Nachzucht anlegen</button>

${p.hatchlings.map((h,n)=>`
<div class='card' style='border:1px solid #ccc'>
<b>🐣 ${h.id}</b><br><br>

<label>🧬 Morph</label>
<input id="hm_${n}" value="${h.morph||''}">

<label>⚥ Geschlecht</label>
<select id="hg_${n}">
<option ${h.gender==='Unbestimmt'?'selected':''}>Unbestimmt</option>
<option ${h.gender==='Weiblich'?'selected':''}>Weiblich</option>
<option ${h.gender==='Männlich'?'selected':''}>Männlich</option>
</select>

<label>⚖ Gewicht</label>
<input id="hw_${n}" type="number" value="${h.weight||0}">

<label>📊 Status</label>
<select id="hs_${n}">
<option ${h.status==='Verfügbar'?'selected':''}>Verfügbar</option>
<option ${h.status==='Reserviert'?'selected':''}>Reserviert</option>
<option ${h.status==='Bezahlt'?'selected':''}>Bezahlt</option>
<option ${h.status==='Abgegeben'?'selected':''}>Abgegeben</option>
</select>

<label>💰 Preis (€)</label>
<input id="hp_${n}" type="number" value="${h.price||0}">

<label>👤 Käufer</label>
<input id="hb_${n}" value="${h.buyer||''}">

<label>📱 Kontakt</label>
<input id="hc_${n}" value="${h.contact||''}">

<label>📅 Reserviert seit</label>
<input id="hr_${n}" type="date" value="${h.reserved||''}">


<button onclick="updateHatchling(${n})">💾 Speichern</button>
<button onclick="moveHatchlingToStock(${n})">🐍 In Bestand übernehmen</button>
<button onclick="moveHatchlingToSales(${n})">💰 In Verkauf übernehmen</button>

<hr>
<h4>🍽 Fütterungen</h4>
<input id="hfd_${n}" type="date">
<select id="hft_${n}">${getFeeders(currentSnake.species||'Königspython').map(f=>`<option>${f}</option>`).join('')}</select>
<input id="hfw_${n}" type="number" placeholder="Futtergewicht">
<select id="hfr_${n}"><option>Gefressen</option><option>Verweigert</option></select>
<button onclick="addHFeed(${n})">Fütterung speichern</button>

<div style="background:#f5f5f5;padding:8px;border-radius:8px;margin:6px 0">
<b>📋 Zusammenfassung</b><br>
🍽 Letzte Fütterung:<br>
${(h.feedings&&h.feedings.length)?`${h.feedings[h.feedings.length-1].date} | ${h.feedings[h.feedings.length-1].feeder} | ${h.feedings[h.feedings.length-1].result}`:'Keine Daten'}<br><br>

⚖ Letztes Gewicht:<br>
${(h.weights&&h.weights.length)?`${h.weights[h.weights.length-1].value} g (${h.weights[h.weights.length-1].date})`:(h.weight||0)+' g'}<br><br>

🪶 Letzte Häutung:<br>
${(h.sheds&&h.sheds.length)?`${h.sheds[h.sheds.length-1].date} | ${h.sheds[h.sheds.length-1].status}`:'Keine Daten'}<br><br>

📊 Statistik:<br>
Fütterungen: ${(h.feedings||[]).length}<br>
Gewichte: ${(h.weights||[]).length}<br>
Häutungen: ${(h.sheds||[]).length}<br>
Fütterungsquote: ${(() => {
const f=h.feedings||[];
if(!f.length) return '0%';
const eaten=f.filter(x=>x.result==='Gefressen').length;
return ((eaten/f.length)*100).toFixed(1)+'%';
})()}<br><br>

💚 Gesundheitsstatus:<br>
${(() => {
const feedings=h.feedings||[];
const weights=h.weights||[];
const sheds=h.sheds||[];

let status='🟢 Optimal';
let reasons=[];

if(feedings.length>0 && feedings[feedings.length-1].result==='Gefressen'){
 reasons.push('✔ letzte Fütterung gefressen');
}

if(weights.length>=2){
 const diff=Number(weights[weights.length-1].value)-Number(weights[0].value);
 if(diff>0){
   reasons.push('✔ Gewichtszunahme '+diff+' g');
 }
 if(diff<0){
   status='🟡 Beobachten';
   reasons.push('⚠ Gewichtsverlust '+Math.abs(diff)+' g');
 }
}

if(sheds.length>0) reasons.push('✔ Häutung dokumentiert');

if(feedings.length===0 && weights.length===0){
 status='🟡 Beobachten';
 reasons.push('⚠ noch zu wenige Daten');
}

return status + '<br>' + reasons.join('<br>');
})()}<br><br>

🍽 Tage seit letzter Fütterung:<br>
${(h.feedings&&h.feedings.length)?Math.max(0,Math.floor((new Date()-new Date(h.feedings[h.feedings.length-1].date))/86400000))+' Tage':'Keine Daten'}<br>

🪶 Tage seit letzter Häutung:<br>
${(h.sheds&&h.sheds.length)?Math.max(0,Math.floor((new Date()-new Date(h.sheds[h.sheds.length-1].date))/86400000))+' Tage':'Keine Daten'}<br>

📈 Gewichtsentwicklung:<br>
${(h.weights&&h.weights.length>=2) ? `${h.weights[0].value} g → ${h.weights[h.weights.length-1].value} g (${((Number(h.weights[h.weights.length-1].value)-Number(h.weights[0].value))>=0?'+':'')}${Number(h.weights[h.weights.length-1].value)-Number(h.weights[0].value)} g)` : 'Keine Daten'}
</div>

${(h.feedings||[]).map(x=>`${x.date} | ${x.feeder} | ${x.feederWeight}g | ${x.result}<br>`).join('')}


<h4>⚖ Gewichte</h4>

<input id="hwv_${n}" type="number" placeholder="Gewicht">
<button onclick="addHWeight(${n})">Gewicht speichern</button>
${(h.weights||[]).map(x=>`${x.date} | ${x.value}g<br>`).join('')}

<button onclick="delHatchling(${n})">🗑 Löschen</button>

</div>
`).join('')}
`;
}

}

function saveClutch(){

 p.clutch.eggs=parseInt(eggs.value||0);

function addHatchling(){
 let p=projects[currentProject];
 p.hatchlings.push({
   id:'NZ-'+Date.now(),
   morph:hMorph.value,
   gender:hGender.value,
   weight:parseInt(hWeight.value||0),
   status:hStatus.value,
   price:parseFloat(hPrice.value||0),

   contact:hContact.value,
   reserved:hReserved.value,

   weights:[],
   sheds:[]
 });

}


function updateHatchling(i){
 const p=projects[currentProject];
 const h=p.hatchlings[i];
 if(!h) return;

 h.morph=document.getElementById('hm_'+i).value;
 h.gender=document.getElementById('hg_'+i).value;
 h.weight=Number(document.getElementById('hw_'+i).value||0);
 h.status=document.getElementById('hs_'+i).value;
 h.price=Number(document.getElementById('hp_'+i).value||0);
 h.buyer=document.getElementById('hb_'+i).value;
 h.contact=document.getElementById('hc_'+i).value;
 h.reserved=document.getElementById('hr_'+i).value;

 localStorage.setItem('kp_projects_v18',JSON.stringify(projects));
 localStorage.setItem('kp_manager_v18',JSON.stringify(snakes));

 h.feedings=h.feedings||[];
 h.weights=h.weights||[];
 h.sheds=h.sheds||[];

}

function delHatchling(i){

function addSnakeToSales(id){
 let s=snakes.find(x=>x.id===id);
 if(s){s.saleListed=true;save();}
}
function removeSnakeFromSales(id){
 let s=snakes.find(x=>x.id===id);
 if(s){s.saleListed=false;save();}
}

function deleteSnake(id){
 if(!confirm('Tier wirklich löschen?')) return;
 snakes = snakes.filter(s => s.id !== id);
 if(currentSnake && currentSnake.id===id){
   document.getElementById('snakeDetail').style.display='none';
   currentSnake=null;
 }
 save();
}

function render(){
let warnings=[]; let refusals=0;
snakes.forEach(s=>{
 if(s.feedings?.length>=3 && s.feedings.slice(-3).every(x=>x.result==="Verweigert")) refusals++;
 if(s.weights?.length>=2){
  let a=parseFloat(s.weights[s.weights.length-2].value||0);
  let b=parseFloat(s.weights[s.weights.length-1].value||0);
  if(a>0){
   let pct=((a-b)/a)*100;
   if(pct>=10) warnings.push('🔴 '+s.name+' -'+pct.toFixed(1)+'%');
   else if(pct>=5) warnings.push('🟡 '+s.name+' -'+pct.toFixed(1)+'%');
  }
 }
});

const sold=hatchlings.filter(h=>h.status==='Abgegeben').length;

function exportBackup(){
 const data={snakes,projects,date:new Date().toISOString()};
 const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='KP_Manager_V18_Backup.json';
 a.click();
}
function importBackup(input){
 const f=input.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=e=>{
   const d=JSON.parse(e.target.result);
   snakes=d.snakes||[];
   projects=d.projects||[];
   save();
   alert('Backup importiert');
 };
 r.readAsText(f);
}
