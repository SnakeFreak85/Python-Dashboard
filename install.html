<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1722">
  <link rel="manifest" href="manifest.json?v=1.0.17">
  <title>NG Terrarium aktualisieren</title>
  <style>
    html,body{margin:0;min-height:100dvh;background:#101820;color:#f5f7fb;font-family:Arial,sans-serif;color-scheme:dark}
    body{display:grid;place-items:center;padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
    .box{max-width:520px;background:#172331;border:1px solid #304255;border-radius:20px;padding:22px;box-shadow:0 16px 40px rgba(0,0,0,.3)}
    h1{margin-top:0}.muted{color:#aab7c4}button{width:100%;min-height:48px;border:1px solid #304255;border-radius:12px;background:#0f1a25;color:#f5f7fb;font-size:16px;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <h1>NG Terrarium</h1>
    <p class="muted">Die App wird aktualisiert. Alte Handy-Caches werden bereinigt.</p>
    <p id="status">Aktualisierung wird vorbereitet…</p>
    <button id="openBtn" type="button">App öffnen</button>
  </main>
  <script>
    (function(){
      'use strict';
      const status = document.getElementById('status');
      const openBtn = document.getElementById('openBtn');
      function openApp(){ window.location.replace('./?source=install&v=1.0.17'); }
      openBtn.addEventListener('click', openApp);

      async function clearOldState(){
        status.textContent = 'Alte Caches werden gelöscht…';
        if(window.caches){
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        if('serviceWorker' in navigator){
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
      }

      async function installFresh(){
        if(!('serviceWorker' in navigator)){
          status.textContent = 'Service Worker wird nicht unterstützt. App wird normal geöffnet.';
          setTimeout(openApp, 700);
          return;
        }
        status.textContent = 'Neue App-Version wird installiert…';
        const registration = await navigator.serviceWorker.register('./service-worker.js?v=1.0.17', {updateViaCache:'none'});
        await registration.update();
        if(registration.waiting){ registration.waiting.postMessage({type:'SKIP_WAITING'}); }
        status.textContent = 'Aktualisierung fertig. App wird geöffnet…';
        setTimeout(openApp, 900);
      }

      clearOldState().then(installFresh).catch(() => {
        status.textContent = 'Automatische Aktualisierung fehlgeschlagen. Bitte Browserdaten für diese Seite löschen oder App neu installieren.';
      });
    })();
  </script>
</body>
</html>
