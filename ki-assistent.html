<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1722">
  <title>KI Assistent · NG Terrarium</title>
  <style>
    html,body{margin:0;min-height:100dvh;background:#101820;color:#f5f7fb;font-family:Arial,sans-serif;color-scheme:dark}
    body{padding:16px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
    .card{max-width:760px;margin:0 auto;background:#172331;border:1px solid #304255;border-radius:18px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.25)}
    h1{margin:0 0 8px}.muted{color:#aab7c4;line-height:1.45}
    textarea{display:block;width:100%;min-height:340px;box-sizing:border-box;border-radius:14px;padding:14px;background:#0f1a25;color:#f5f7fb;border:1px solid #69d2c4;font-size:16px;line-height:1.45;resize:vertical}
    button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;margin-top:12px;min-height:48px;border:1px solid #304255;border-radius:12px;background:#0f1a25;color:#f5f7fb;font-size:16px;font-weight:700;text-decoration:none;line-height:48px}
    .result{margin-top:12px}.panel{background:#0f1a25;border:1px solid #304255;border-radius:12px;padding:10px;margin-top:8px}.ok{border-color:#69d2c4}.warn{border-color:#e06c75}
  </style>
</head>
<body>
  <main class="card">
    <h1>🤖 KI Assistent</h1>
    <p class="muted">Versteht natürliche Kurzbefehle und Blöcke für Fütterungen, Häutungen, Gewichte und Futterbestand.</p>
    <textarea id="cmd" autocomplete="off" spellcheck="true" placeholder="Medusa gefressen
Medusa verweigert
Medusa gehäutet
Medusa 2450 gramm

Heute gefüttert
Medusa
Caramel
Sandy

Medusa
26.06.2026 200 gramm
27.06.2026 200 gramm verweigert

Häutungen
Medusa
25.06.2026
26.06.2026

Gewichte
Medusa
25.06.2026 2500 gramm
27.06.2026 2800 gramm

Erhöhe Futterbestand
200 gramm 18
150 gramm 21"></textarea>
    <button id="run" type="button">Befehl ausführen</button>
    <a class="btn" href="./?source=assistant&v=1.0.33">Zurück zur App</a>
    <div id="out" class="result"></div>
  </main>
<script src="./v1-data-manager.js?v=1.0.30"></script>
<script>
(function(){
'use strict';
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function today(){return new Date().toISOString().slice(0,10);}
function parseDate(v){const s=String(v||'');const m=s.match(/(\d{1,2})[.\-/](\d{1,2})(?:[.\-/](\d{2,4}))?/);if(!m)return '';const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(new Date().getFullYear());return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
function pretty(d){const p=String(d||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d;}
function grams(line){const m=String(line||'').match(/(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\b/i);return m?m[1].replace(',','.'):'';}
function resultFromText(line){const l=norm(line);if(l.includes('verweigert')||l.includes('nicht gefressen')||l.includes('wollte nicht fressen')||l.includes('abgelehnt'))return false;if(l.includes('gefressen')||l.includes('angenommen')||l.includes('hat gefressen'))return true;return null;}
function feederText(line){const m=String(line).match(/(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?/i);if(!m)return '';return m[1].replace(',','.')+' gramm '+(m[2]||'Ratte');}
function wait(fn){if(window.NGTData){fn();return;}setTimeout(()=>wait(fn),100);}
function cleanAnimal(line){return String(line).replace(/\d{1,2}[.\-/]\d{1,2}(?:[.\-/]\d{2,4})?/g,' ').replace(/\d+(?:[,.]\d+)?\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?/ig,' ').replace(/heute|hat|wurde|ist|wiegt|gehäutet|gehaeutet|häutung|haeutung|gefressen|verweigert|angenommen|abgelehnt|nicht gefressen|wollte nicht fressen/ig,' ').trim().split(/\s+/)[0]||'';}
function findAnimalName(line,current){const c=cleanAnimal(line);return window.NGTData.findAnimal(c)?c:current;}
function headerKind(line){const l=norm(line).replace(/:$/,'').trim();if(l.includes('futterbestand'))return 'stock';if(l.includes('haeutungen')||l.includes('hautungen')||l.includes('gehäutet')&&l.includes('heute'))return 'shed-list';if(l.includes('gewichte'))return 'weight';if(l.includes('heute gefuttert')||l.includes('heute gefüttert')||l.includes('gefuttert heute')||l.includes('gefüttert heute'))return 'feed-today';if(l.includes('futterungen')||l.includes('futterung')||l.includes('fütterungen')||l.includes('fütterung'))return 'feed';return '';}
function animalExists(name){return !!(name&&window.NGTData.findAnimal(name));}
function stockLine(line){const m=String(line).match(/^([+\-])?\s*(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?\s+(\d+)\s*$/i);if(!m)return null;const op=m[1]||'=';const name=m[2].replace(',','.')+'g '+(m[3]||'Ratte');const qty=Number(m[4])||0;if(op==='-'){window.NGTData.reduceFood(name,qty);return 'Bestand '+name+' -'+qty;}if(op==='+'){const data=window.NGTData.load();let item=(data.foodInventory||[]).find(x=>norm(x.name)===norm(name));const next=(Number(item&&item.qty||0)+qty);window.NGTData.setFood(name,next);return 'Bestand '+name+' +'+qty+' = '+next;}window.NGTData.setFood(name,qty);return 'Bestand '+name+' = '+qty;}
function addFeed(animal,line,dateOverride,acceptedOverride){const date=dateOverride||parseDate(line)||today();const eaten=acceptedOverride!==undefined?acceptedOverride:(resultFromText(line)!==false);const ftxt=feederText(line);const entry={date:date,accepted:eaten,note:'KI Assistent'};if(ftxt){const p=window.NGTData.feederParts(ftxt);entry.prey=p.prey;entry.amount=p.amount;entry.size=p.size;}const saved=window.NGTData.addFeed(animal,entry);const used=saved&&saved.animal&&saved.animal.feeds?saved.animal.feeds.find(f=>f.date===date&&f.note==='KI Assistent'):entry;const label=((used&&used.amount)?used.amount+'g ':'')+(used&&used.prey?used.prey:'');if(label.trim())window.NGTData.reduceFood(label.trim(),1);return (saved&&saved.animal&&saved.animal.name||animal)+' '+pretty(date)+' '+(used&&used.accepted?'gefressen':'verweigert')+' '+label+' · Bestand reduziert';}
function addShed(animal,line,dateOverride){const date=dateOverride||parseDate(line)||today();const saved=window.NGTData.addShed(animal,{date:date,quality:'ok',complete:true,note:'KI Assistent'});return (saved&&saved.animal&&saved.animal.name||animal)+' Häutung '+pretty(date);}
function addWeight(animal,line,dateOverride){const date=dateOverride||parseDate(line)||today();const g=grams(line);if(!g)return null;const saved=window.NGTData.addWeight(animal,{date:date,weight:Number(g),note:'KI Assistent'});return (saved&&saved.animal&&saved.animal.name||animal)+' Gewicht '+pretty(date)+' '+g+'g';}
function isWeightLine(line,kind){const l=norm(line);return grams(line)&&(kind==='weight'||l.includes('wiegt')||(!feederText(line)&&!l.includes('gefressen')&&!l.includes('verweigert')));}
function execute(lines){let kind='feed';let animal='';const ok=[];const errors=[];for(const raw of lines){const line=raw.trim();if(!line)continue;const hk=headerKind(line);if(hk){kind=hk;continue;}if(kind==='stock'){const r=stockLine(line);r?ok.push(r):errors.push('Futterbestand nicht erkannt: '+line);continue;}const lineAnimal=findAnimalName(line,animal);const pureAnimal=animalExists(line.trim())&&!parseDate(line)&&!grams(line)&&!resultFromText(line)&&!norm(line).includes('gehaeutet')&&!norm(line).includes('gehäutet');if(pureAnimal){animal=line.trim();if(kind==='feed-today')ok.push(addFeed(animal,line,today(),true));if(kind==='shed-list')ok.push(addShed(animal,line,today()));continue;}animal=lineAnimal;if(!animal){errors.push('Kein Tier gewählt: '+line);continue;}const l=norm(line);if(kind==='feed-today'){ok.push(addFeed(animal,line,today(),true));continue;}if(kind==='shed-list'||l.includes('gehäutet')||l.includes('gehaeutet')||(kind==='shed'&&parseDate(line))){ok.push(addShed(animal,line));continue;}if(isWeightLine(line,kind)){const r=addWeight(animal,line);r?ok.push(r):errors.push('Gewicht nicht erkannt: '+line);continue;}if(parseDate(line)||resultFromText(line)!==null||feederText(line)){ok.push(addFeed(animal,line));continue;}errors.push('Befehl nicht erkannt: '+line);}return {ok,errors};}
function run(){wait(function(){const out=document.getElementById('out');const lines=document.getElementById('cmd').value.split(/\n|;/).map(x=>x.trim()).filter(Boolean);const r=execute(lines);out.innerHTML=(r.ok.length?'<div class="panel ok">✅ '+r.ok.length+' Eintrag/Einträge gespeichert.</div>':'')+r.ok.map(x=>'<div class="panel">'+esc(x)+'</div>').join('')+r.errors.map(x=>'<div class="panel warn">❌ '+esc(x)+'</div>').join('');});}
document.getElementById('run').addEventListener('click',run);
})();
</script>
</body>
</html>
