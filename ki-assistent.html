<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1722">
  <title>KI Assistent · NG Terrarium</title>
  <style>
    html,body{margin:0;min-height:100dvh;background:#101820;color:#f5f7fb;font-family:Arial,sans-serif;color-scheme:dark}
    body{padding:16px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
    .card{max-width:760px;margin:0 auto;background:#172331;border:1px solid #304255;border-radius:18px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.25)}
    h1{margin:0 0 8px}.muted{color:#aab7c4;line-height:1.45}
    textarea{display:block;width:100%;min-height:380px;box-sizing:border-box;border-radius:14px;padding:14px;background:#0f1a25;color:#f5f7fb;border:1px solid #69d2c4;font-size:16px;line-height:1.45;resize:vertical}
    button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;margin-top:12px;min-height:48px;border:1px solid #304255;border-radius:12px;background:#0f1a25;color:#f5f7fb;font-size:16px;font-weight:700;text-decoration:none;line-height:48px}
    .result{margin-top:12px}.panel{background:#0f1a25;border:1px solid #304255;border-radius:12px;padding:10px;margin-top:8px}.ok{border-color:#69d2c4}.warn{border-color:#e06c75}.info{border-color:#f0c674}
  </style>
</head>
<body>
  <main class="card">
    <h1>🤖 KI Assistent</h1>
    <p class="muted">Intelligente Eingabe für Routineaufgaben. Kennt Tiernamen, Rufnamen, Standardfutter und Gruppen wie Königspythons, Boas, Geckos und Spinnen.</p>
    <textarea id="cmd" autocomplete="off" spellcheck="true" placeholder="Medusa gefressen
Medusa wollte nicht fressen
Medusa gehäutet
Medusa wiegt 2450 Gramm

Heute alle Königspythons gefüttert
Heute alle Boas gehäutet

Heute gefüttert
Medusa
Caramel
Sandy

Medusa
26.06. 200 gramm
27.06. 200 gramm verweigert

Gewichte
Medusa
25.06. 2500 gramm
27.06. 2800 gramm

Erhöhe Futterbestand
200 gramm 18
+150 gramm 5
-120 gramm 3"></textarea>
    <button id="run" type="button">Befehl ausführen</button>
    <a class="btn" href="./?source=assistant&v=1.0.35">Zurück zur App</a>
    <div id="out" class="result"></div>
  </main>
<script src="./v1-data-manager.js?v=1.0.30"></script>
<script>
(function(){
'use strict';
const TYPE_LABELS={koenig:'Königspythons',boas:'Boas',geckos:'Leopardgeckos',spinnen:'Vogelspinnen'};
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function today(){return new Date().toISOString().slice(0,10);}
function daysSince(date){const t=Date.parse(date||'');if(!t)return null;return Math.floor((Date.now()-t)/86400000);}
function parseDate(v){const s=String(v||'');if(norm(s).includes('heute'))return today();const m=s.match(/(\d{1,2})[.\-/](\d{1,2})(?:[.\-/](\d{2,4}))?/);if(!m)return '';const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(new Date().getFullYear());return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
function pretty(d){const p=String(d||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d;}
function grams(line){const m=String(line||'').match(/(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\b/i);return m?m[1].replace(',','.'):'';}
function resultFromText(line){const l=norm(line);if(/verweigert|nicht gefressen|wollte nicht fressen|frisst nicht|abgelehnt|nicht angenommen/.test(l))return false;if(/gefressen|angenommen|hat gefressen|hat angenommen|fressen ok|frass|fraß/.test(l))return true;return null;}
function feederText(line){const m=String(line).match(/(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?/i);if(!m)return '';return m[1].replace(',','.')+' gramm '+(m[2]||'Ratte');}
function wait(fn){if(window.NGTData){fn();return;}setTimeout(()=>wait(fn),100);}
function records(){return window.NGTData.allAnimals();}
function animals(){return records().map(x=>x.animal).filter(Boolean);}
function findAnimalSmart(text){const key=norm(text);if(!key)return null;let hit=window.NGTData.findAnimal(text);if(hit)return hit;const list=animals();const best=list.map(a=>({a,score:scoreAnimal(key,a)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0];return best&&best.score>=60?window.NGTData.findAnimal(best.a.uuid||best.a.name):null;}
function scoreAnimal(key,a){const names=[a.name,a.nickname,a.rufname,a.displayId].map(norm).filter(Boolean);let best=0;names.forEach(n=>{if(n===key)best=Math.max(best,100);else if(n.startsWith(key)||key.startsWith(n))best=Math.max(best,80);else if(n.includes(key)||key.includes(n))best=Math.max(best,65);});return best;}
function suggestion(name){const key=norm(name);const hit=animals().map(a=>({name:a.name||a.displayId||a.uuid,score:scoreAnimal(key,a)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0];return hit?' Meintest du '+hit.name+'?':'';}
function cleanAnimal(line){return String(line).replace(/\d{1,2}[.\-/]\d{1,2}(?:[.\-/]\d{2,4})?/g,' ').replace(/\d+(?:[,.]\d+)?\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?/ig,' ').replace(/heute|gestern|alle|hat|wurde|ist|wiegt|gewicht|gehäutet|gehaeutet|häutung|haeutung|gefüttert|gefuttert|gefressen|verweigert|angenommen|abgelehnt|nicht gefressen|wollte nicht fressen|frisst nicht|bitte|eintragen|füge|fuege|hinzu/ig,' ').trim().split(/\s+/)[0]||'';}
function headerKind(line){const l=norm(line).replace(/:$/,'').trim();if(l.includes('futterbestand'))return 'stock';if(l.includes('haeutungen')||l.includes('hautungen')||l.includes('häutungen')||l.includes('heute gehaeutet')||l.includes('heute gehäutet'))return 'shed-list';if(l.includes('gewichte'))return 'weight';if(l.includes('heute gefuttert')||l.includes('heute gefüttert')||l.includes('gefuttert heute')||l.includes('gefüttert heute'))return 'feed-today';if(l.includes('futterungen')||l.includes('futterung')||l.includes('fütterungen')||l.includes('fütterung'))return 'feed';return '';}
function groupFromText(line){const l=norm(line);let type='';if(l.includes('konig')||l.includes('könig')||l.includes('python'))type='koenig';else if(l.includes('boa'))type='boas';else if(l.includes('gecko'))type='geckos';else if(l.includes('spinne')||l.includes('vogelspinne'))type='spinnen';if(!type)return null;return records().filter(x=>x.type===type).map(x=>window.NGTData.findAnimal(x.animal.uuid||x.animal.name)).filter(Boolean);}
function groupCommandKind(line){const l=norm(line);if(!l.includes('alle'))return '';if(l.includes('gefuttert')||l.includes('gefüttert')||l.includes('gefressen'))return 'feed';if(l.includes('gehaeutet')||l.includes('gehäutet'))return 'shed';return '';}
function stockLine(line){const m=String(line).match(/^([+\-])?\s*(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?\s+(\d+)\s*$/i);if(!m)return null;const op=m[1]||'=';const name=m[2].replace(',','.')+'g '+(m[3]||'Ratte');const qty=Number(m[4])||0;if(op==='-'){window.NGTData.reduceFood(name,qty);return 'Bestand '+name+' -'+qty;}if(op==='+'){const data=window.NGTData.load();let item=(data.foodInventory||[]).find(x=>norm(x.name)===norm(name));const next=(Number(item&&item.qty||0)+qty);window.NGTData.setFood(name,next);return 'Bestand '+name+' +'+qty+' = '+next;}window.NGTData.setFood(name,qty);return 'Bestand '+name+' = '+qty;}
function latest(arr){return (arr||[]).slice().sort((a,b)=>(Date.parse(b.date||'')||0)-(Date.parse(a.date||'')||0))[0]||null;}
function feedStreak(a){let n=0;for(const f of (a.feeds||[]).slice().sort((x,y)=>(Date.parse(y.date||'')||0)-(Date.parse(x.date||'')||0))){if(f.accepted===false)break;n++;}return n;}
function insightAfterFeed(a,label){const notes=[];const streak=feedStreak(a);if(streak>=3)notes.push((a.name||'Tier')+' hat '+streak+' Fütterungen hintereinander angenommen.');const lw=latest(a.weights);const d=daysSince(lw&&lw.date);if(d!==null&&d>42)notes.push('Letztes Gewicht von '+(a.name||'Tier')+' ist '+d+' Tage alt.');if(label){const data=window.NGTData.load();const item=(data.foodInventory||[]).find(x=>norm(x.name)===norm(label));if(item&&Number(item.qty)<=3)notes.push('Futterbestand '+label+' ist niedrig: '+Number(item.qty||0));}return notes;}
function insightAfterWeight(a,newWeight){const w=(a.weights||[]).slice().sort((x,y)=>(Date.parse(y.date||'')||0)-(Date.parse(x.date||'')||0));if(w.length<2)return [];const prev=Number(w[1].weight||0);if(!prev)return [];const diff=Number(newWeight)-prev;return ['Gewichtsänderung bei '+(a.name||'Tier')+': '+(diff>=0?'+':'')+diff+'g seit letzter Wiegung.'];}
function defaultLabel(saved,entry){const used=saved&&saved.animal&&saved.animal.feeds?saved.animal.feeds[saved.animal.feeds.length-1]:entry;return {used,label:((used&&used.amount)?used.amount+'g ':'')+(used&&used.prey?used.prey:'')};}
function addFeed(hit,line,dateOverride,acceptedOverride){const id=hit.animal.uuid||hit.animal.name;const date=dateOverride||parseDate(line)||today();const eaten=acceptedOverride!==undefined?acceptedOverride:(resultFromText(line)!==false);const ftxt=feederText(line);const entry={date:date,accepted:eaten,note:'KI Assistent'};if(ftxt){const p=window.NGTData.feederParts(ftxt);entry.prey=p.prey;entry.amount=p.amount;entry.size=p.size;}const saved=window.NGTData.addFeed(id,entry);const dl=defaultLabel(saved,entry);if(dl.label.trim())window.NGTData.reduceFood(dl.label.trim(),1);const infos=dl.label.trim()?insightAfterFeed(saved.animal,dl.label.trim()):['Kein Standardfutter hinterlegt, Bestandsabzug nicht möglich.'];return {text:(saved&&saved.animal&&saved.animal.name||hit.animal.name)+' '+pretty(date)+' '+(dl.used&&dl.used.accepted?'gefressen':'verweigert')+' '+dl.label+' · Bestand reduziert',infos};}
function addShed(hit,line,dateOverride){const date=dateOverride||parseDate(line)||today();const saved=window.NGTData.addShed(hit.animal.uuid||hit.animal.name,{date:date,quality:'ok',complete:true,note:'KI Assistent'});return {text:(saved&&saved.animal&&saved.animal.name||hit.animal.name)+' Häutung '+pretty(date),infos:[]};}
function addWeight(hit,line,dateOverride){const date=dateOverride||parseDate(line)||today();const g=grams(line);if(!g)return null;const saved=window.NGTData.addWeight(hit.animal.uuid||hit.animal.name,{date:date,weight:Number(g),note:'KI Assistent'});return {text:(saved&&saved.animal&&saved.animal.name||hit.animal.name)+' Gewicht '+pretty(date)+' '+g+'g',infos:insightAfterWeight(saved.animal,g)};}
function isWeightLine(line,kind){const l=norm(line);return grams(line)&&(kind==='weight'||l.includes('wiegt')||l.includes('gewicht'))&&!/ratte|maus|asf|küken|kueken|heimchen|schabe|gefressen|verweigert/.test(l);}
function pushResult(bucket,res){if(!res)return;bucket.ok.push(res.text);(res.infos||[]).forEach(x=>bucket.warnings.push(x));}
function execute(lines){let kind='feed';let current=null;const bucket={ok:[],warnings:[],errors:[]};for(const raw of lines){const line=raw.trim();if(!line)continue;const gkind=groupCommandKind(line);const group=gkind?groupFromText(line):null;if(group&&group.length){group.forEach(hit=>pushResult(bucket,gkind==='feed'?addFeed(hit,line,today(),true):addShed(hit,line,today())));continue;}const hk=headerKind(line);if(hk){kind=hk;continue;}if(kind==='stock'){const r=stockLine(line);r?bucket.ok.push(r):bucket.warnings.push('Futterbestand nicht eindeutig erkannt: '+line);continue;}let candidate=cleanAnimal(line);let hit=findAnimalSmart(candidate)||current;const pureAnimal=findAnimalSmart(line)&&!parseDate(line)&&!grams(line)&&resultFromText(line)===null&&!/gehäutet|gehaeutet/.test(norm(line));if(pureAnimal){current=findAnimalSmart(line);hit=current;if(kind==='feed-today')pushResult(bucket,addFeed(hit,line,today(),true));if(kind==='shed-list')pushResult(bucket,addShed(hit,line,today()));continue;}if(!hit){bucket.errors.push('Tier nicht gefunden: '+(candidate||line)+(candidate?suggestion(candidate):''));continue;}current=hit;const l=norm(line);let res=null;if(kind==='feed-today'){pushResult(bucket,addFeed(hit,line,today(),true));continue;}if(kind==='shed-list'||/gehäutet|gehaeutet/.test(l)||(kind==='shed'&&parseDate(line))){pushResult(bucket,addShed(hit,line));continue;}if(isWeightLine(line,kind)){res=addWeight(hit,line);res?pushResult(bucket,res):bucket.warnings.push('Gewicht nicht erkannt: '+line);continue;}if(parseDate(line)||resultFromText(line)!==null||feederText(line)){pushResult(bucket,addFeed(hit,line));continue;}bucket.warnings.push('Nicht eindeutig. Ich habe nichts gespeichert für: '+line);}return bucket;}
function run(){wait(function(){const out=document.getElementById('out');const lines=document.getElementById('cmd').value.split(/\n|;/).map(x=>x.trim()).filter(Boolean);const r=execute(lines);out.innerHTML=(r.ok.length?'<div class="panel ok">✅ '+r.ok.length+' Eintrag/Einträge gespeichert.</div>':'')+r.ok.map(x=>'<div class="panel">'+esc(x)+'</div>').join('')+r.warnings.map(x=>'<div class="panel info">💡 '+esc(x)+'</div>').join('')+r.errors.map(x=>'<div class="panel warn">❌ '+esc(x)+'</div>').join('');});}
document.getElementById('run').addEventListener('click',run);
})();
</script>
</body>
</html>
