<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1722">
  <title>KI Assistent · NG Terrarium</title>
  <style>
    html,body{margin:0;min-height:100dvh;background:#101820;color:#f5f7fb;font-family:Arial,sans-serif;color-scheme:dark}
    body{padding:16px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
    .card{max-width:760px;margin:0 auto;background:#172331;border:1px solid #304255;border-radius:18px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.25)}
    h1{margin:0 0 8px}.muted{color:#aab7c4;line-height:1.45}
    textarea{display:block;width:100%;min-height:260px;box-sizing:border-box;border-radius:14px;padding:14px;background:#0f1a25;color:#f5f7fb;border:1px solid #69d2c4;font-size:16px;line-height:1.45;resize:vertical}
    button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;margin-top:12px;min-height:48px;border:1px solid #304255;border-radius:12px;background:#0f1a25;color:#f5f7fb;font-size:16px;font-weight:700;text-decoration:none;line-height:48px}
    .result{margin-top:12px}.panel{background:#0f1a25;border:1px solid #304255;border-radius:12px;padding:10px;margin-top:8px}.ok{border-color:#69d2c4}.warn{border-color:#e06c75}
  </style>
</head>
<body>
  <main class="card">
    <h1>🤖 KI Assistent</h1>
    <p class="muted">Kurzbefehle: <b>Medusa 30.06.2026 gefressen</b> oder <b>Medusa 200 gramm Ratte</b> als Standard-Futter.</p>
    <textarea id="cmd" autocomplete="off" spellcheck="true" placeholder="Medusa 200 gramm Ratte
Caramel 150 gramm Ratte

Medusa 30.06.2026 gefressen
Caramel 30.06.2026 verweigert"></textarea>
    <button id="run" type="button">Befehl ausführen</button>
    <a class="btn" href="./?source=assistant&v=1.0.29">Zurück zur App</a>
    <div id="out" class="result"></div>
  </main>
<script src="./v1-data-manager.js?v=1.0.29"></script>
<script>
(function(){
'use strict';
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseDate(v){const m=String(v||'').match(/(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{2,4})/);if(!m)return '';return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
function pretty(d){const p=String(d||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d;}
function resultFromText(line){const l=norm(line);if(l.includes('verweigert')||l.includes('nicht gefressen')||l.includes('abgelehnt'))return false;if(l.includes('gefressen')||l.includes('angenommen'))return true;return null;}
function feederText(line){const m=String(line).match(/(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)/i);return m?(m[1].replace(',','.')+' gramm '+m[2]):'';}
function lineAnimal(line){let cleaned=String(line).replace(/\d{1,2}[.\-/]\d{1,2}[.\-/]\d{2,4}/g,' ').replace(/\d+(?:[,.]\d+)?\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)/ig,' ').replace(/gefressen|verweigert|angenommen|abgelehnt|nicht gefressen/ig,' ').trim();return cleaned.split(/\s+/)[0]||cleaned;}
function foodStock(line){const m=String(line).match(/bestand\s+(.+?)\s*(?:-|:|auf)?\s*(\d+)\s*$/i);return m?{name:m[1].trim(),qty:Number(m[2])||0}:null;}
function wait(fn){if(window.NGTData){fn();return;}setTimeout(()=>wait(fn),100);}
function executeLine(line){const date=parseDate(line);const animal=lineAnimal(line);const ftxt=feederText(line);const eaten=resultFromText(line);const stock=foodStock(line);if(stock){window.NGTData.setFood(stock.name,stock.qty);return {kind:'food',text:'Bestand '+stock.name+' = '+stock.qty};}if(!animal)return {error:'Kein Tier erkannt: '+line};const hit=window.NGTData.findAnimal(animal);if(!hit)return {error:'Tier nicht gefunden: '+animal};const id=hit.animal.uuid||hit.animal.name||animal;if(ftxt&&!date){window.NGTData.setDefaultFeeder(id,ftxt);return {kind:'default',text:(hit.animal.name||animal)+' Standard: '+ftxt};}if(date){let entry={date:date,accepted:eaten!==false,note:'KI Assistent'};if(ftxt){const p=window.NGTData.feederParts(ftxt);entry.prey=p.prey;entry.amount=p.amount;entry.size=p.size;}const saved=window.NGTData.addFeed(id,entry);const used=saved&&saved.animal&&saved.animal.feeds?saved.animal.feeds.find(f=>f.date===date&&f.note==='KI Assistent'):entry;const label=((used&&used.amount)?used.amount+'g ':'')+(used&&used.prey?used.prey:'');if(used&&used.accepted&&label.trim())window.NGTData.reduceFood(label.trim(),1);return {kind:'feed',text:(hit.animal.name||animal)+' '+pretty(date)+' '+(used&&used.accepted?'gefressen':'verweigert')+' '+label};}return {error:'Kein Datum oder Standard-Futter erkannt: '+line};}
function run(){wait(function(){const out=document.getElementById('out');const lines=document.getElementById('cmd').value.split(/\n|;/).map(x=>x.trim()).filter(Boolean);const results=lines.map(executeLine);const errors=results.filter(r=>r.error);const ok=results.filter(r=>!r.error);out.innerHTML=(ok.length?'<div class="panel ok">✅ '+ok.length+' Befehl(e) gespeichert.</div>':'')+ok.map(r=>'<div class="panel">'+esc(r.text)+'</div>').join('')+errors.map(r=>'<div class="panel warn">❌ '+esc(r.error)+'</div>').join('');});}
document.getElementById('run').addEventListener('click',run);
})();
</script>
</body>
</html>
