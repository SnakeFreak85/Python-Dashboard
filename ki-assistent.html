<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1722"><title>KI Assistent · NG Terrarium</title><style>
html,body{margin:0;min-height:100dvh;background:#101820;color:#f5f7fb;font-family:Arial,sans-serif;color-scheme:dark}body{padding:16px;padding-bottom:max(24px,env(safe-area-inset-bottom))}.card{max-width:760px;margin:0 auto;background:#172331;border:1px solid #304255;border-radius:18px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.25)}h1{margin:0 0 8px}.muted{color:#aab7c4;line-height:1.45}textarea{display:block;width:100%;min-height:400px;box-sizing:border-box;border-radius:14px;padding:14px;background:#0f1a25;color:#f5f7fb;border:1px solid #69d2c4;font-size:16px;line-height:1.45;resize:vertical}button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;margin-top:12px;min-height:48px;border:1px solid #304255;border-radius:12px;background:#0f1a25;color:#f5f7fb;font-size:16px;font-weight:700;text-decoration:none;line-height:48px}.result{margin-top:12px}.panel{background:#0f1a25;border:1px solid #304255;border-radius:12px;padding:10px;margin-top:8px}.ok{border-color:#69d2c4}.warn{border-color:#e06c75}.info{border-color:#f0c674}
</style></head><body><main class="card"><h1>🤖 KI Assistent</h1><p class="muted">Versteht freie Sätze, Kurzbefehle, Blöcke, Gruppen und mehrere Tiere gleichzeitig.</p><textarea id="cmd" autocomplete="off" spellcheck="true" placeholder="Heute haben Medusa und Sandy gefressen, Caramel hat verweigert
Medusa und Caramel wurden heute gehäutet
Medusa wiegt 2450 Gramm
Heute alle Königspythons gefüttert

27.06. 200 gramm verweigert

Medusa
25.06. 2500 gramm
27.06. 2800 gramm

Erhöhe Futterbestand
200 gramm 18
+150 gramm 5
-120 gramm 3"></textarea><button id="run" type="button">Befehl ausführen</button><a class="btn" href="./?source=assistant&v=1.0.36">Zurück zur App</a><div id="out" class="result"></div></main>
<script src="./v1-data-manager.js?v=1.0.30"></script><script>
(function(){'use strict';
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function daysSince(d){const t=Date.parse(d||'');return t?Math.floor((Date.now()-t)/86400000):null}function parseDate(v){const s=String(v||'');if(norm(s).includes('heute'))return today();const m=s.match(/(\d{1,2})[.\-/](\d{1,2})(?:[.\-/](\d{2,4}))?/);if(!m)return '';const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(new Date().getFullYear());return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}function pretty(d){const p=String(d||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d}function grams(s){const m=String(s||'').match(/(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\b/i);return m?m[1].replace(',',''):''}function resultText(s){const l=norm(s);if(/verweigert|nicht gefressen|wollte nicht fressen|frisst nicht|abgelehnt|nicht angenommen/.test(l))return false;if(/gefressen|gefuttert|gefüttert|angenommen|hat gefressen|frass|fraß/.test(l))return true;return null}function feederText(s){const m=String(s).match(/(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?/i);return m?m[1].replace(',','.')+' gramm '+(m[2]||'Ratte'):''}function wait(fn){if(window.NGTData)fn();else setTimeout(()=>wait(fn),100)}
function recs(){return window.NGTData.allAnimals()}function animals(){return recs().map(x=>x.animal).filter(Boolean)}function nameOf(a){return a.name||a.nickname||a.rufname||a.displayId||a.uuid}function score(key,a){const names=[a.name,a.nickname,a.rufname,a.displayId].map(norm).filter(Boolean);let b=0;names.forEach(n=>{if(n===key)b=Math.max(b,100);else if(n.startsWith(key)||key.startsWith(n))b=Math.max(b,82);else if(n.includes(key)||key.includes(n))b=Math.max(b,66)});return b}function findSmart(txt){const key=norm(txt);if(!key)return null;let h=window.NGTData.findAnimal(txt);if(h)return h;const best=animals().map(a=>({a,score:score(key,a)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0];return best&&best.score>=60?window.NGTData.findAnimal(best.a.uuid||best.a.name):null}function suggest(txt){const key=norm(txt);const best=animals().map(a=>({name:nameOf(a),score:score(key,a)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0];return best?' Meintest du '+best.name+'?':''}
function group(line){const l=norm(line);let t='';if(l.includes('konig')||l.includes('könig')||l.includes('python'))t='koenig';else if(l.includes('boa'))t='boas';else if(l.includes('gecko'))t='geckos';else if(l.includes('spinne'))t='spinnen';return t?recs().filter(x=>x.type===t).map(x=>window.NGTData.findAnimal(x.animal.uuid||x.animal.name)).filter(Boolean):null}function groupAction(line){const l=norm(line);if(!l.includes('alle'))return '';if(/gefuttert|gefüttert|gefressen/.test(l))return 'feed';if(/gehaeutet|gehäutet/.test(l))return 'shed';return ''}
function cleanAnimal(line){return String(line).replace(/\d{1,2}[.\-/]\d{1,2}(?:[.\-/]\d{2,4})?/g,' ').replace(/\d+(?:[,.]\d+)?\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?/ig,' ').replace(/heute|gestern|alle|haben|hat|wurde|wurden|ist|sind|und|wiegt|gewicht|gehäutet|gehaeutet|häutung|haeutung|gefüttert|gefuttert|gefressen|verweigert|angenommen|abgelehnt|nicht gefressen|wollte nicht fressen|frisst nicht|bitte|eintragen|füge|fuege|hinzu/ig,' ').trim().split(/\s+/)[0]||''}function animalsInText(line){const l=norm(line);return animals().filter(a=>[a.name,a.nickname,a.rufname,a.displayId].some(n=>n&&l.includes(norm(n)))).map(a=>window.NGTData.findAnimal(a.uuid||a.name)).filter(Boolean)}function splitClauses(text){return text.split(/\n|;|,(?=\s*[A-Za-zÄÖÜäöüß])/).map(x=>x.trim()).filter(Boolean)}
function latest(arr){return (arr||[]).slice().sort((a,b)=>(Date.parse(b.date||'')||0)-(Date.parse(a.date||'')||0))[0]||null}function streak(a){let n=0;for(const f of (a.feeds||[]).slice().sort((x,y)=>(Date.parse(y.date||'')||0)-(Date.parse(x.date||'')||0))){if(f.accepted===false)break;n++}return n}function feedHints(a,label){const out=[];const s=streak(a);if(s>=3)out.push(nameOf(a)+' hat '+s+' Fütterungen hintereinander angenommen.');const lw=latest(a.weights);const d=daysSince(lw&&lw.date);if(d!==null&&d>42)out.push('Letztes Gewicht von '+nameOf(a)+' ist '+d+' Tage alt.');if(label){const data=window.NGTData.load();const item=(data.foodInventory||[]).find(x=>norm(x.name)===norm(label));if(item&&Number(item.qty)<=3)out.push('Futterbestand '+label+' ist niedrig: '+Number(item.qty||0));}return out}function weightHints(a,g){const w=(a.weights||[]).slice().sort((x,y)=>(Date.parse(y.date||'')||0)-(Date.parse(x.date||'')||0));if(w.length<2)return [];const prev=Number(w[1].weight||0);const diff=Number(g)-prev;return prev?['Gewichtsänderung bei '+nameOf(a)+': '+(diff>=0?'+':'')+diff+'g seit letzter Wiegung.']:[]}
function addFeed(hit,line,dateOverride,acceptedOverride){const id=hit.animal.uuid||hit.animal.name;const date=dateOverride||parseDate(line)||today();const accepted=acceptedOverride!==undefined?acceptedOverride:(resultText(line)!==false);const entry={date,accepted,note:'KI Assistent'};const ft=feederText(line);if(ft){const p=window.NGTData.feederParts(ft);entry.prey=p.prey;entry.amount=p.amount;entry.size=p.size}const saved=window.NGTData.addFeed(id,entry);const used=saved.animal.feeds[saved.animal.feeds.length-1]||entry;const label=((used.amount)?used.amount+'g ':'')+(used.prey||'');if(label.trim())window.NGTData.reduceFood(label.trim(),1);return {text:nameOf(saved.animal)+' '+pretty(date)+' '+(used.accepted?'gefressen':'verweigert')+' '+label+' · Bestand reduziert',infos:label.trim()?feedHints(saved.animal,label.trim()):['Kein Standardfutter hinterlegt, Bestandsabzug nicht möglich.']}}function addShed(hit,line,dateOverride){const date=dateOverride||parseDate(line)||today();const saved=window.NGTData.addShed(hit.animal.uuid||hit.animal.name,{date,quality:'ok',complete:true,note:'KI Assistent'});return {text:nameOf(saved.animal)+' Häutung '+pretty(date),infos:[]}}function addWeight(hit,line,dateOverride){const date=dateOverride||parseDate(line)||today();const g=grams(line);if(!g)return null;const saved=window.NGTData.addWeight(hit.animal.uuid||hit.animal.name,{date,weight:Number(g),note:'KI Assistent'});return {text:nameOf(saved.animal)+' Gewicht '+pretty(date)+' '+g+'g',infos:weightHints(saved.animal,g)}}function stockLine(line){const m=String(line).match(/^([+\-])?\s*(\d+(?:[,.]\d+)?)\s*(?:g|gramm|gr)\s*(ratte|maus|asf|küken|kueken|heimchen|schabe)?\s+(\d+)\s*$/i);if(!m)return null;const op=m[1]||'=';const name=m[2].replace(',','.')+'g '+(m[3]||'Ratte');const qty=Number(m[4])||0;if(op==='-'){window.NGTData.reduceFood(name,qty);return 'Bestand '+name+' -'+qty}if(op==='+'){const data=window.NGTData.load();let item=(data.foodInventory||[]).find(x=>norm(x.name)===norm(name));const next=(Number(item&&item.qty||0)+qty);window.NGTData.setFood(name,next);return 'Bestand '+name+' +'+qty+' = '+next}window.NGTData.setFood(name,qty);return 'Bestand '+name+' = '+qty}
function push(b,r){if(!r)return;b.ok.push(r.text);(r.infos||[]).forEach(x=>b.info.push(x))}function kindHeader(line){const l=norm(line);if(l.includes('futterbestand'))return 'stock';if(l.includes('gewichte'))return 'weight';if(l.includes('haeutungen')||l.includes('häutungen'))return 'shed';if(l.includes('futterungen')||l.includes('fütterungen')||l.includes('futterung')||l.includes('fütterung'))return 'feed';if(/heute gefuttert|heute gefüttert/.test(l))return 'feed-today';return ''}
function execute(rawLines){let kind='feed',current=null;const b={ok:[],info:[],err:[]};for(const raw of rawLines){for(const line of splitClauses(raw)){const h=kindHeader(line);if(h){kind=h;continue}const ga=groupAction(line),gs=ga?group(line):null;if(gs&&gs.length){gs.forEach(hit=>push(b,ga==='feed'?addFeed(hit,line,today(),true):addShed(hit,line,today())));continue}if(kind==='stock'||norm(line).includes('futterbestand')){const r=stockLine(line);r?b.ok.push(r):b.info.push('Futterbestand nicht eindeutig erkannt: '+line);continue}let targets=animalsInText(line);if(!targets.length){const ca=cleanAnimal(line);const hit=findSmart(ca);if(hit)targets=[hit];else if(current)targets=[current]}const pure=targets.length===1&&!parseDate(line)&&!grams(line)&&resultText(line)===null&&!/gehäutet|gehaeutet/.test(norm(line))&&norm(line)===norm(nameOf(targets[0].animal));if(pure){current=targets[0];if(kind==='feed-today')push(b,addFeed(current,line,today(),true));if(kind==='shed')push(b,addShed(current,line,today()));continue}if(!targets.length){b.err.push('Tier nicht gefunden: '+(cleanAnimal(line)||line)+suggest(cleanAnimal(line)));continue}current=targets[targets.length-1];const l=norm(line);const isWeight=grams(line)&&(kind==='weight'||l.includes('wiegt')||l.includes('gewicht'))&&!/ratte|maus|asf|küken|kueken|heimchen|schabe|gefressen|verweigert/.test(l);targets.forEach(hit=>{if(kind==='feed-today')push(b,addFeed(hit,line,today(),true));else if(kind==='shed'||/gehäutet|gehaeutet/.test(l))push(b,addShed(hit,line));else if(isWeight)push(b,addWeight(hit,line));else if(parseDate(line)||resultText(line)!==null||feederText(line))push(b,addFeed(hit,line));else b.info.push('Nicht eindeutig. Ich habe nichts gespeichert für: '+line)})}}return b}
function run(){wait(function(){const out=document.getElementById('out');const lines=document.getElementById('cmd').value.split(/\n/).map(x=>x.trim()).filter(Boolean);const r=execute(lines);out.innerHTML=(r.ok.length?'<div class="panel ok">✅ '+r.ok.length+' Eintrag/Einträge gespeichert.</div>':'')+r.ok.map(x=>'<div class="panel">'+esc(x)+'</div>').join('')+r.info.map(x=>'<div class="panel info">💡 '+esc(x)+'</div>').join('')+r.err.map(x=>'<div class="panel warn">❌ '+esc(x)+'</div>').join('')})}document.getElementById('run').addEventListener('click',run);
})();</script></body></html>
