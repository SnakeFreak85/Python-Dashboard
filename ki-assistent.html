<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111b">
<meta name="description" content="TerraControl Schnelleingabe öffnen.">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./v500/styles.css?v=1.0.4-rc.11">

<title>TerraControl Schnelleingabe</title>
</head>
<body class="tc2StandaloneBody">
<header class="tc2StandaloneHeader">
 <div class="tc2StandaloneLogo" aria-hidden="true">TC</div>
 <div class="tc2StandaloneBrand">
  <b>TerraControl</b>
  <small>Schnelleingabe</small>
 </div>
</header>
<main class="tc2StandaloneShell narrow">
 <section class="tc2StandaloneHero">
  <span class="tc2StandaloneEyebrow">TC2 Schnelleingabe</span>
  <h1>Die aktuelle Schnelleingabe wird geöffnet</h1>
  <p>
   Die frühere Einzelseite wurde in die gemeinsame TerraControl-App
   übernommen. Alle Eingaben verwenden dort dieselben Tier- und
   Futterdaten.
  </p>
  <div class="tc2StandaloneStatus" role="status">
   <span aria-hidden="true">●</span>
   <span>Weiterleitung zur aktuellen TC2-Ansicht …</span>
  </div>
  <a class="tc2StandaloneButton" href="./v500.html?v=1.0.4-rc.11">
   Schnelleingabe öffnen
  </a>
 </section>
</main>
<script>
(function(){
 'use strict';
 try{
  sessionStorage.setItem(
   'terracontrol_current_route_v1',
   JSON.stringify({name:'assistant',args:{}})
  );
 }catch(error){}

 window.setTimeout(function(){
  window.location.replace('./v500.html?v=1.0.4-rc.11');
 },350);
})();
</script>
</body>
</html>
