<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TerraControl Abgabe PDF</title>
<link rel="stylesheet" href="./v500/styles.css?v=500.2">
<style>
.printPage{background:#fff;color:#111;border-radius:18px;padding:28px;margin:18px 0;font-family:Arial,sans-serif;box-shadow:0 12px 28px rgba(0,0,0,.18)}.pdfTop{display:flex;justify-content:space-between;gap:18px;border-bottom:4px solid #172331;padding-bottom:14px;margin-bottom:18px}.brand{font-size:30px;font-weight:900}.sub{color:#445}.badge{background:#172331;color:#fff;border-radius:999px;padding:9px 14px;height:max-content}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:stretch}.animalPhoto{width:100%;height:260px;object-fit:cover;border-radius:18px;background:#e8edf2;border:1px solid #d9e0e7}.qrPanel{text-align:center}.qrPanel canvas,.qrPanel img{margin:auto}.box{border:1px solid #d9e0e7;border-radius:14px;padding:14px;background:#f7f9fb;margin:14px 0}.box h3{margin:0 0 10px}.kv{display:flex;justify-content:space-between;border-bottom:1px solid #e2e7ec;padding:7px 0;gap:14px}.kv span{color:#566}.kv b{text-align:right}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #d9e0e7;text-align:left;padding:8px;font-size:13px}.empty{color:#667}.signs>div>div{height:70px;border-bottom:1px solid #111;margin-top:32px}.pageBreak{page-break-before:always}.noPrint{display:block}.tiny{font-size:11px;color:#667}@media print{body{background:#fff;color:#000}.appHeader,.noPrint{display:none!important}.wrap{max-width:none;padding:0}.printPage{box-shadow:none;border-radius:0;margin:0;min-height:100vh}.pageBreak{page-break-before:always}.box{break-inside:avoid}.animalPhoto{height:220px}.qrPanel canvas{width:120px!important;height:120px!important}}
</style>
</head>
<body>
<header class="appHeader"><h1>TerraControl</h1><div class="version">Terraristik Dashboard</div></header>
<main class="wrap">
<div class="card noPrint">
<h2>Abgabe & PDF</h2>
<p class="muted">Verkäuferdaten speichern, Käufer eintragen, Vorschau prüfen und als PDF speichern.</p>
<div id="msg"></div>
<h3>Verkäuferdaten</h3>
<input id="sName" placeholder="Name Verkäufer">
<input id="sStreet" placeholder="Straße / Hausnummer">
<input id="sCity" placeholder="PLZ / Ort">
<input id="sContact" placeholder="Telefon / E-Mail">
<button id="saveSeller">Verkäufer speichern</button>
<h3>Käuferdaten</h3>
<input id="bName" placeholder="Name Käufer">
<input id="bStreet" placeholder="Straße / Hausnummer Käufer">
<input id="bCity" placeholder="PLZ / Ort Käufer">
<input id="bContact" placeholder="Telefon / E-Mail Käufer">
<h3>Tier</h3>
<select id="animalSel"></select>
<textarea id="remarks" placeholder="Sonstige Bemerkungen"></textarea>
<div class="btnRow"><button id="previewBtn">Vorschau erstellen</button><button id="printBtn">PDF / Drucken</button></div>
<a class="btn" href="./v500.html">Zurück zur App</a>
</div>
<div id="doc"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="./v500/core.js?v=500.1"></script>
<script src="./v500/store.js?v=500.1"></script>
<script src="./v500/pdf-v2.js?v=500.3"></script>
</body>
</html>
